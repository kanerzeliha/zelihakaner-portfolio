<style>

/* ================================================================
   ZK Portfolio — Design System
   Canvas #f8f9fa · Text #0a0a0a · Headings #16255f
   Accent #1e6fe0 · Hover #1247a8 · Border #adb5bd · Radius 16px
   ================================================================ */
:root {
  --bg: #f8f9fa;
  --text: #0a0a0a;
  --heading: #16255f;
  --deep: #16255f;           /* marka lacivert zemin (iki temada da sabit) */
  --on-accent: #ffffff;
  --chip-bg: #e9f1ff;
  --chip-text: #1247a8;
  --chip-bg-2: #e7eefb;  --chip-text-2: #1d3f9e;
  --chip-bg-3: #eef5ff;  --chip-text-3: #1e6fe0;
  --header-bg: rgba(248, 249, 250, 0.72);
  color-scheme: light;
  --accent: #1e6fe0;
  --accent-hover: #1247a8;
  --net: #1d3f9e;
  --border: #adb5bd;
  --surface: #ffffff;
  --shadow: 0 10px 30px rgba(10, 10, 10, 0.04);
  --shadow-lift: 0 18px 44px rgba(22, 37, 95, 0.10);
  --radius: 16px;
  --muted: #5a5a66;
  --font-display: "Sora", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
  --header-h: 72px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--heading); line-height: 1.15; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

/* ---------------- Header ---------------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  background: var(--header-bg);
  border-bottom: 1px solid rgba(173, 181, 189, 0.35);
}
.site-header .wrap {
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
}
.monogram {
  font-family: var(--font-display);
  font-weight: 800; font-size: 1.45rem; letter-spacing: 0.02em;
  color: var(--heading);
  display: inline-flex; align-items: center; gap: 10px;
}
.monogram .dot { color: var(--accent); }
.main-nav { display: flex; gap: 30px; }
.main-nav a {
  font-weight: 500; font-size: 0.95rem; color: var(--heading);
  padding: 6px 2px; position: relative; transition: color .18s ease;
}
.main-nav a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 2.5px; background: var(--accent); border-radius: 2px;
  transform: scaleX(0); transform-origin: left; transition: transform .22s ease;
}
.main-nav a:hover { color: var(--accent-hover); }
.main-nav a.active { color: var(--accent); }
.main-nav a.active::after, .main-nav a:hover::after { transform: scaleX(1); }
.nav-toggle { display: none; background: none; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 1.1rem; color: var(--heading); }

/* ---------------- Hero ---------------- */
.hero { padding: 84px 0 64px; }
.hero-grid {
  display: grid; grid-template-columns: 1.15fr 0.85fr;
  gap: 56px; align-items: center;
}
.hero-role {
  text-transform: uppercase; letter-spacing: 0.22em;
  font-size: 0.8rem; font-weight: 700; color: var(--accent);
  margin-bottom: 18px;
}
.hero h1 {
  font-size: clamp(2.6rem, 5.6vw, 4.2rem);
  font-weight: 800; letter-spacing: -0.02em; color: var(--text);
  margin-bottom: 22px;
}
.hero h1 .accent-line { color: var(--heading); }
.hero p.lede { font-size: 1.08rem; color: var(--muted); max-width: 56ch; margin-bottom: 34px; }

.cta-row { display: flex; gap: 16px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 26px; border-radius: 14px;
  font-weight: 600; font-size: 0.98rem;
  transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.btn-primary { background: var(--accent); color: #fff; border: 1.5px solid var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(30, 111, 224, 0.28); }
.btn-outline { background: transparent; color: var(--heading); border: 1.5px solid var(--heading); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.btn-dark { background: var(--text); color: #fff; border: 1.5px solid var(--text); width: 100%; justify-content: center; }
.btn-dark:hover { transform: scale(1.025); box-shadow: 0 14px 30px rgba(10,10,10,0.18); }

.hero-visual { position: relative; min-height: 340px; }
.hero-visual svg { width: 100%; height: auto; }

/* ---------------- Bento primitives ---------------- */
.section { padding: 56px 0; }
.section-head { margin-bottom: 34px; }
.section-head .eyebrow {
  text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.75rem;
  font-weight: 700; color: var(--accent); display: block; margin-bottom: 10px;
}
.section-head h2 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); font-weight: 800; }
.section-head p { color: var(--muted); margin-top: 10px; max-width: 68ch; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); border-color: rgba(30, 111, 224, 0.45); }

.bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.bento .span-2 { grid-column: span 2; }
.bento .span-4 { grid-column: span 4; }

/* ---------------- Project cards ---------------- */
.project-card { display: flex; flex-direction: column; overflow: hidden; }
.project-media {
  height: 210px; position: relative; overflow: hidden;
  border-bottom: 1px solid rgba(173,181,189,0.4);
  background: linear-gradient(135deg, var(--chip-bg) 0%, var(--bg) 60%);
}
.project-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.project-card:hover .project-media img { transform: scale(1.04); }
.project-media .placeholder {
  position: absolute; inset: 0; display: grid; place-items: center;
}
.project-body { padding: 26px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.project-body h3 { font-size: 1.28rem; font-weight: 700; }
.case-row { font-size: 0.94rem; color: var(--muted); }
.case-row strong { color: var(--heading); font-weight: 700; display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 3px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
.pill {
  background: var(--surface); border: 1px solid var(--border); color: var(--heading);
  border-radius: 999px; padding: 5px 13px; font-size: 0.8rem; font-weight: 600;
  transition: border-color .18s ease, color .18s ease;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.solid { background: var(--chip-bg); border-color: rgba(30,111,224,.35); }

/* ---------------- About page ---------------- */
.about-grid { display: grid; grid-template-columns: 40% 1fr; gap: 30px; align-items: start; }
.about-sticky { position: sticky; top: calc(var(--header-h) + 24px); }
.profile-card { padding: 30px; text-align: center; }
.profile-photo {
  width: 168px; height: 168px; border-radius: 50%; object-fit: cover;
  margin: 0 auto 18px; border: 3px solid var(--chip-bg); box-shadow: var(--shadow);
}
.profile-photo.placeholder {
  display: grid; place-items: center; background: linear-gradient(135deg, var(--chip-bg), var(--bg));
  color: var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 2.6rem;
}
.profile-card h3 { font-size: 1.4rem; margin-bottom: 4px; }
.profile-card .role { color: var(--accent); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 18px; }
.profile-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; }
.profile-links a {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--heading);
  transition: border-color .18s ease, color .18s ease, transform .18s ease;
}
.profile-links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

.about-stream { display: flex; flex-direction: column; gap: 22px; }
.block { padding: 28px; }
.block h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); margin-bottom: 18px; font-weight: 700; }
.edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.edu-item { border-left: 3px solid var(--accent); padding-left: 16px; }
.edu-item h4 { font-size: 1.05rem; margin-bottom: 3px; }
.edu-item .meta { color: var(--muted); font-size: 0.9rem; }
.gpa-badge { display: inline-block; margin-top: 6px; background: var(--chip-bg); color: var(--chip-text); font-weight: 700; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px; }

.xp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.xp-head h4 { font-size: 1.15rem; }
.xp-head .period { color: var(--accent); font-weight: 700; font-size: 0.85rem; }
.xp-sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
.xp-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.xp-list li { padding-left: 22px; position: relative; font-size: 0.95rem; color: var(--text); }
.xp-list li::before { content: ""; position: absolute; left: 0; top: 9px; width: 8px; height: 8px; border-radius: 3px; background: var(--accent); }
.xp-list li strong { color: var(--heading); }

.skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.skill-cat h4 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--heading); margin-bottom: 10px; }
.lang-row { display: flex; gap: 16px; flex-wrap: wrap; }
.lang-badge {
  flex: 1; min-width: 200px; display: flex; align-items: center; gap: 14px;
  border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: var(--surface);
}
.lang-badge .flag { width: 42px; height: 42px; border-radius: 12px; background: var(--chip-bg); display: grid; place-items: center; color: var(--accent); font-weight: 800; font-family: var(--font-display); }
.lang-badge h5 { color: var(--heading); font-size: 1rem; }
.lang-badge span { color: var(--muted); font-size: 0.85rem; }

/* ---------------- Blog ---------------- */
.blog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
.post-card { overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.post-cover { height: 190px; background: linear-gradient(135deg, var(--chip-bg), var(--bg)); border-bottom: 1px solid rgba(173,181,189,.4); }
.post-cover img { width: 100%; height: 100%; object-fit: cover; }
.post-body { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.post-date { color: var(--accent); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
.post-body h3 { font-size: 1.2rem; }
.post-body p { color: var(--muted); font-size: 0.94rem; }
.read-more { color: var(--accent); font-weight: 700; font-size: 0.9rem; margin-top: auto; padding-top: 6px; }
.post-card:hover .read-more { color: var(--accent-hover); }

.reader-overlay {
  position: fixed; inset: 0; z-index: 90; background: rgba(22,37,95,0.35);
  backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center;
  padding: 6vh 20px; overflow-y: auto;
}
.reader-overlay.open { display: flex; }
.reader {
  background: var(--surface); border-radius: var(--radius); max-width: 760px; width: 100%;
  padding: 44px; box-shadow: var(--shadow-lift); position: relative;
}
.reader h2 { margin: 8px 0 20px; }
.reader .body { white-space: pre-wrap; color: var(--text); font-size: 1rem; }
.reader-close {
  position: absolute; top: 18px; right: 18px; width: 38px; height: 38px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  font-size: 1rem; color: var(--heading);
}
.reader-close:hover { border-color: var(--accent); color: var(--accent); }

/* ---------------- Chatbot ---------------- */
.chat-fab {
  position: fixed; right: 26px; bottom: 26px; z-index: 80;
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  box-shadow: 0 14px 34px rgba(30,111,224,.4);
  display: grid; place-items: center;
  transition: transform .2s ease, background .2s ease;
}
.chat-fab:hover { background: var(--accent-hover); transform: translateY(-3px); }
.chat-panel {
  position: fixed; right: 26px; bottom: 100px; z-index: 80;
  width: 372px; max-width: calc(100vw - 40px); height: 520px; max-height: 70vh;
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: var(--shadow-lift);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(16px) scale(.97); opacity: 0; pointer-events: none;
  transition: transform .26s cubic-bezier(.2,.9,.3,1.2), opacity .22s ease;
}
.chat-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.chat-head {
  background: var(--heading); color: #fff; padding: 16px 18px;
  display: flex; align-items: center; gap: 12px;
}
.chat-head img { height: 30px; }
.chat-head h4 { color: #fff; font-size: 0.98rem; }
.chat-head span { font-size: 0.75rem; color: #a9c6f2; }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; white-space: pre-wrap; }
.msg.bot { background: var(--chip-bg); color: var(--text); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.user { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.chat-pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
.chat-pills button {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  font-size: 0.76rem; padding: 6px 12px; color: var(--heading);
  transition: border-color .15s, color .15s;
}
.chat-pills button:hover { border-color: var(--accent); color: var(--accent); }
.chat-input { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid rgba(173,181,189,.4); }
.chat-input input {
  flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
  font-family: inherit; font-size: 0.9rem; outline: none; background: var(--bg); color: var(--text);
}
.chat-input input:focus { border-color: var(--accent); }
.chat-input button { background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 0 16px; font-weight: 700; }
.chat-input button:hover { background: var(--accent-hover); }

/* ---------------- Footer ---------------- */
.site-footer { border-top: 1px solid rgba(173,181,189,.35); margin-top: 40px; }
.site-footer .wrap { padding: 34px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.site-footer p { color: var(--muted); font-size: 0.88rem; }
.footer-logo { height: 40px; filter: none; background: var(--heading); padding: 8px 14px; border-radius: 12px; }

/* ---------------- Reveal animation ---------------- */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  * { animation: none !important; }
}

/* ---------------- Responsive ---------------- */
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; gap: 36px; }
  .bento { grid-template-columns: 1fr 1fr; }
  .bento .span-2, .bento .span-4 { grid-column: span 2; }
  .about-grid { grid-template-columns: 1fr; }
  .about-sticky { position: static; }
}
@media (max-width: 680px) {
  .main-nav {
    display: none; position: absolute; top: var(--header-h); left: 0; right: 0;
    background: rgba(248,249,250,.97); flex-direction: column; gap: 0;
    border-bottom: 1px solid rgba(173,181,189,.4); padding: 10px 28px 18px;
  }
  .main-nav.open { display: flex; }
  .main-nav a { padding: 12px 0; }
  .nav-toggle { display: block; }
  .bento, .blog-grid, .edu-grid, .skills-grid { grid-template-columns: 1fr; }
  .bento .span-2, .bento .span-4 { grid-column: span 1; }
  .reader { padding: 28px 20px; }
}

/* ---------------- Admin (single-file) ---------------- */
body.admin-mode { padding-bottom: 80px; }
.admin-bar { position: sticky; top: 0; z-index: 50; background: var(--deep); color: #fff; padding: 14px 0; }
.admin-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.admin-bar h1 { color: #fff; font-size: 1.1rem; }
.admin-bar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.abtn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: .85rem; cursor: pointer; }
.abtn.save { background: var(--accent); color: #fff; }
.abtn.save:hover { background: var(--accent-hover); }
.abtn.publish { background: #fff; color: var(--heading); }
.abtn.danger { background: transparent; color: #ffb4b4; border: 1px solid #ffb4b4; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 20px; }
.tabs button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: .88rem; color: var(--heading); }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.panel { display: none; }
.panel.active { display: block; }
.fcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 18px; }
.fcard h3 { font-size: 1rem; margin-bottom: 14px; color: var(--heading); }
.fcard label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 5px; }
.fcard input[type=text], .fcard input[type=date], .fcard input[type=password], #gate input[type=password], .fcard textarea, .fcard select {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px;
  font-family: inherit; font-size: .93rem; background: var(--bg); color: var(--text); outline: none;
}
.fcard input:focus, .fcard textarea:focus, .fcard select:focus, #gate input:focus { border-color: var(--accent); }
.fcard textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.mini { font-size: .78rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; cursor: pointer; }
.mini.del { color: #c0392b; border-color: #e3b1ab; }
.mini.add { color: var(--accent); border-color: var(--accent); }
.thumb { height: 90px; border-radius: 10px; border: 1px solid var(--border); object-fit: cover; margin-top: 8px; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--deep); color: #fff; padding: 12px 22px; border-radius: 12px; font-size: .9rem; transition: transform .3s ease; z-index: 99; }
.toast.show { transform: translateX(-50%) translateY(0); }
#gate { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: grid; place-items: center; }
#gate .fcard { width: 360px; max-width: 90vw; text-align: center; }
#gate img { height: 54px; margin: 0 auto 14px; background: var(--heading); border-radius: 12px; padding: 8px 14px; }
@media (max-width: 680px) { .row2 { grid-template-columns: 1fr; } }

/* hero SVG animations (moved out of SVG defs for single-file) */
.hero-visual .node { fill: #1e6fe0; }
.hero-visual .node.alt { fill: #1d3f9e; }
.hero-visual .pulse { animation: zkpulse 2.6s ease-in-out infinite; }
.hero-visual .pulse.d1 { animation-delay: .5s; }
.hero-visual .pulse.d2 { animation-delay: 1s; }
.hero-visual .pulse.d3 { animation-delay: 1.6s; }
@keyframes zkpulse { 0%,100% { r: 6; } 50% { r: 10; } }
.hero-visual .float { animation: zkfloat 7s ease-in-out infinite; }
.hero-visual .float.f2 { animation-delay: -3s; }
@keyframes zkfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.hero-visual .dash { stroke-dasharray: 6 8; animation: zkdash 3.5s linear infinite; }
@keyframes zkdash { to { stroke-dashoffset: -56; } }

/* ================================================================
   v2 — Renk & tasarım güncellemeleri (beyaz tema + canlı mor paleti)
   ================================================================ */
:root { --header-h: 84px;
  --grad: linear-gradient(100deg, #16255f 0%, #1d3f9e 35%, #1e6fe0 72%, #35c3f0 100%);
  --grad-text: linear-gradient(100deg, #16255f 0%, #1d3f9e 35%, #1e6fe0 72%, #35c3f0 100%); }

/* Header: büyük logo çipi + gradient aktif çizgi + dil anahtarı */
.logo-chip {
  display: inline-flex; align-items: center;
  background: #16255f; border-radius: 16px; padding: 9px 16px;
  box-shadow: 0 8px 22px rgba(22, 37, 95, 0.22);
  transition: transform .2s ease, box-shadow .2s ease;
}
.logo-chip:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(30,111,224,.35); }
.logo-chip img { height: 46px; display: block; }
.main-nav a::after { background: var(--grad); height: 3px; }
.main-nav { align-items: center; }
.lang-toggle {
  display: inline-flex; border: 1.5px solid var(--border); border-radius: 999px;
  overflow: hidden; margin-left: 8px;
}
.lang-toggle button {
  border: none; background: transparent; padding: 6px 13px;
  font-weight: 700; font-size: .78rem; color: var(--muted); letter-spacing: .04em;
}
.lang-toggle button.on { background: var(--accent); color: #fff; }
.lang-toggle button:not(.on):hover { color: var(--accent-hover); }

/* Hero: renkli fon lekeleri + gradient başlık */
.hero { position: relative; overflow: hidden; }
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; pointer-events: none; z-index: -1;
  filter: blur(70px);
}
.hero::before { width: 460px; height: 460px; right: -120px; top: -140px;
  background: radial-gradient(circle, rgba(30,111,224,.16), transparent 65%); }
.hero::after { width: 380px; height: 380px; left: -140px; bottom: -160px;
  background: radial-gradient(circle, rgba(29,63,158,.12), transparent 65%); }
.hero h1 {
  background: var(--grad-text);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: #16255f;
}
.hero-role { color: var(--accent-hover); }

/* Eyebrow'lar gradient, kartlarda renkli üst şerit */
.section-head .eyebrow {
  background: var(--grad-text);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--accent);
}
.project-card { position: relative; }
.project-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--grad); opacity: 0; transition: opacity .25s ease;
  border-radius: 16px 16px 0 0; z-index: 2;
}
.project-card:hover::before { opacity: 1; }

/* Renkli pill varyantları (paletten tonlar) */
.pill.tint0, .pill.solid { background: var(--chip-bg); border-color: rgba(30,111,224,.35); color: var(--chip-text); }
.pill.tint1 { background: var(--chip-bg-2); border-color: rgba(29,63,158,.35); color: var(--chip-text-2); }
.pill.tint2 { background: var(--chip-bg-3); border-color: rgba(18,71,168,.3); color: var(--chip-text-3); }

/* Blog kapak yer tutucuları: paletten degrade */
.post-cover.grad0 { background: linear-gradient(135deg, var(--chip-bg), var(--chip-bg-2) 60%, var(--bg)); }
.post-cover.grad1 { background: linear-gradient(135deg, var(--chip-bg-2), var(--chip-bg) 60%, var(--bg)); }
.post-cover.grad2 { background: linear-gradient(135deg, var(--chip-bg-3), var(--chip-bg) 60%, var(--bg)); }

/* Footer: koyu gece moru bant */
.site-footer { background: var(--deep); border-top: none; margin-top: 60px; }
.site-footer .wrap { padding: 40px 28px; }
.site-footer p, .site-footer a { color: #c9d9ff; }
.site-footer a { font-weight: 600; }
.site-footer a:hover { color: #fff; }
.footer-logo { background: transparent; padding: 0; height: 48px; }

/* Chat: gradient buton ve başlık */
.chat-fab { background: var(--grad); }
.chat-fab:hover { background: linear-gradient(100deg, #1d3f9e, #1247a8); }
.chat-head { background: var(--grad); }

/* Görüş & İletişim: gradient çerçeveli kart */
.contact-frame { background: var(--grad); border-radius: 20px; padding: 2px; }
.contact-card { background: var(--surface); border-radius: 18px; padding: 34px; }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.contact-grid textarea { grid-column: span 2; min-height: 120px; resize: vertical; }
.contact-grid input, .contact-grid textarea {
  border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px;
  font-family: inherit; font-size: .95rem; background: var(--bg); color: var(--text); outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.contact-grid input:focus, .contact-grid textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,111,224,.14);
}
.contact-grid .btn { justify-self: start; }
.cf-status { grid-column: span 2; font-size: .9rem; min-height: 1.2em; }
.cf-status.ok { color: #1d7a4f; font-weight: 600; }
.cf-status.err { color: #c0392b; font-weight: 600; }

/* Profil / lang rozetlerinde renk */
.lang-badge .flag { background: var(--grad); color: #fff; }
.gpa-badge { background: var(--grad); color: #fff; }
.edu-item { border-left: 3px solid; border-image: var(--grad) 1; }

@media (max-width: 680px) {
  .logo-chip img { height: 36px; }
  .contact-grid { grid-template-columns: 1fr; }
  .contact-grid textarea, .cf-status { grid-column: span 1; }
  .lang-toggle { margin: 10px 0 0; align-self: flex-start; }
}

/* ================================================================
   v3 — detay sayfaları, ok butonları, istatistik bandı, timeline
   ================================================================ */
.tagline {
  font-family: var(--font-display); font-weight: 700; font-size: 1.02rem;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--accent);
  margin: -18px 0 32px;
}
.hero-role { transition: opacity .24s ease, transform .24s ease; }
.hero-role.swap { opacity: 0; transform: translateY(6px); }

.stats-band { padding: 6px 0 10px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); text-align: center; padding: 22px 12px;
  transition: transform .2s ease, border-color .2s ease;
}
.stat:hover { transform: translateY(-3px); border-color: rgba(30,111,224,.45); }
.stat-v {
  font-family: var(--font-display); font-weight: 800; font-size: 1.9rem;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--accent);
}
.stat-l { color: var(--muted); font-size: .85rem; font-weight: 600; margin-top: 2px; }

.card-go {
  position: absolute; top: 14px; right: 14px; z-index: 3;
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--heading);
  box-shadow: var(--shadow);
  transition: background .2s ease, color .2s ease, transform .2s ease, border-color .2s ease;
}
.project-card:hover .card-go, .post-card:hover .card-go { background: var(--accent); border-color: var(--accent); color: #fff; transform: translate(2px, -2px); }
.card-go:hover { background: var(--accent-hover) !important; border-color: var(--accent-hover) !important; }
.post-card { position: relative; }
.post-cover { display: block; }
.post-body h3 a:hover, .project-body h3 a:hover { color: var(--accent-hover); }

.back-link { color: var(--accent); font-weight: 700; font-size: .92rem; }
.back-link:hover { color: var(--accent-hover); }
.detail-media { margin: 26px 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
.detail-media img { width: 100%; max-height: 440px; object-fit: cover; }
.detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 26px; }
.detail-grid .block p { color: var(--text); font-size: .95rem; }
.detail-body { margin-top: 22px; }
.detail-body p { margin-bottom: 14px; font-size: 1rem; }
.detail-body p:last-child { margin-bottom: 0; }
.post-full { max-width: 820px; }
.post-title { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 8px 0 8px;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--heading); }

.story p { margin-bottom: 13px; font-size: .96rem; }
.story p:last-child { margin-bottom: 0; }

.timeline { position: relative; padding-left: 4px; }
.tl-item { display: flex; gap: 18px; position: relative; padding: 0 0 22px 0; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: 34px; top: 30px; bottom: -2px; width: 2px;
  background: linear-gradient(var(--accent), var(--chip-bg));
}
.tl-item:last-child::before { display: none; }
.tl-year {
  flex: 0 0 68px; height: 30px; border-radius: 999px; background: var(--grad); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: .82rem;
  font-family: var(--font-display); z-index: 1;
}
.tl-text { padding-top: 4px; font-size: .95rem; color: var(--text); }

.cf-wide { grid-column: span 2; }

@media (max-width: 980px) { .detail-grid { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 680px) { .cf-wide { grid-column: span 1; } }


/* ================================================================
   v4 — yeni mavi marka: logo yerleşimleri
   ================================================================ */
.logo-chip { background: transparent; box-shadow: none; padding: 4px 0; border-radius: 0; }
.logo-chip:hover { box-shadow: none; transform: translateY(-2px) scale(1.02); }
.logo-chip img { height: 54px; }

.hero-visual { display: grid; place-items: center; }
.hero-lockup {
  width: min(92%, 470px);
  filter: drop-shadow(0 24px 50px rgba(30,111,224,.22));
  animation: zkfloat 7s ease-in-out infinite;
}

.chat-head img { background: #fff; border-radius: 10px; padding: 5px 9px; height: 34px; }

.site-footer { background: var(--deep); }
.footer-chip { background: #fff; border-radius: 14px; padding: 10px 16px; display: inline-flex; }
.footer-chip img { height: 40px; }

#gate img { background: transparent; border-radius: 0; padding: 0; height: auto; width: 230px; margin: 0 auto 10px; }

@media (max-width: 680px) { .logo-chip img { height: 42px; } }



/* ================================================================
   v5 — GECE / GÜNDÜZ TEMASI + arayüz cilası
   ================================================================ */
html { transition: background-color .28s ease; }
body { transition: background-color .28s ease, color .28s ease; }
.card, .stat, .pill, .contact-card, .fcard { transition: background-color .28s ease, border-color .28s ease, color .28s ease, transform .22s ease, box-shadow .22s ease; }

/* --- tema anahtarı --- */
.theme-toggle {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1.5px solid var(--border); background: var(--surface);
  display: grid; place-items: center; color: var(--heading);
  margin-left: 10px; padding: 0; flex: 0 0 auto;
  transition: border-color .18s ease, color .18s ease, transform .18s ease, background-color .28s ease;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.theme-toggle svg { width: 19px; height: 19px; }
.theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
[data-theme="dark"] .theme-toggle .icon-sun { display: none; }

/* --- KOYU TEMA --- */
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a1120;
  --surface: #111d33;
  --text: #e8eefc;
  --heading: #f2f7ff;
  --muted: #9db0d0;
  --border: #26385a;
  --accent: #4d97f5;
  --accent-hover: #8bc0ff;
  --chip-bg: #16294a;   --chip-text: #bcd8ff;
  --chip-bg-2: #142645; --chip-text-2: #aecdfb;
  --chip-bg-3: #172d51; --chip-text-3: #a8ccff;
  --header-bg: rgba(10, 17, 32, 0.8);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --shadow-lift: 0 18px 46px rgba(0, 0, 0, 0.6);
  --grad: linear-gradient(100deg, #1d3f9e 0%, #1e6fe0 50%, #35c3f0 100%);
  --grad-text: linear-gradient(100deg, #8bc0ff 0%, #4d97f5 45%, #57d8ff 100%);
}
[data-theme="dark"] .site-header { border-bottom-color: rgba(38, 56, 90, .8); }
[data-theme="dark"] .hero::before { background: radial-gradient(circle, rgba(77,151,245,.20), transparent 65%); }
[data-theme="dark"] .hero::after { background: radial-gradient(circle, rgba(53,195,240,.13), transparent 65%); }
[data-theme="dark"] .hero-lockup { filter: drop-shadow(0 24px 50px rgba(77,151,245,.28)) brightness(1.12); }
[data-theme="dark"] .logo-chip img { filter: brightness(1.15); }
[data-theme="dark"] .btn-dark { background: var(--accent); border-color: var(--accent); color: #fff; }
[data-theme="dark"] .btn-outline { border-color: var(--accent); color: var(--accent); }
[data-theme="dark"] .abtn.publish { background: #fff; color: var(--deep); }
[data-theme="dark"] .card-go { background: var(--surface); }
[data-theme="dark"] .reader-overlay { background: rgba(3, 8, 18, .62); }
[data-theme="dark"] .hero-visual svg rect[fill="#ffffff"] { fill: #111d33; }
[data-theme="dark"] .site-footer { background: #060d1a; }
[data-theme="dark"] .footer-chip { background: #0f1a2e; }
[data-theme="dark"] .chat-head img { background: #0f1a2e; }
[data-theme="dark"] .lang-toggle { border-color: var(--border); }
[data-theme="dark"] ::placeholder { color: #7b8fb3; }

/* --- cila: yumuşak sayfa girişi + yukarı çık butonu --- */
main { animation: pagein .32s ease both; }
@keyframes pagein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.to-top {
  position: fixed; right: 26px; bottom: 98px; z-index: 70;
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--surface); border: 1.5px solid var(--border); color: var(--heading);
  display: grid; place-items: center; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease, border-color .18s ease, color .18s ease;
}
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
@media (max-width: 680px) { .to-top { right: 20px; bottom: 92px; width: 40px; height: 40px; } }
@media (prefers-reduced-motion: reduce) { main { animation: none; } }

/* ================================================================
   v6 — Apple tarzı hareket, kayan projeler, yol zaman çizelgesi
   ================================================================ */

/* --- yumuşak, katmanlı giriş --- */
.reveal { opacity: 0; transform: translateY(26px) scale(.985); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); transition-delay: var(--d, 0ms); }
.reveal.in { opacity: 1; transform: none; }
.rise { opacity: 0; transform: translateY(22px); animation: rise .85s cubic-bezier(.16,1,.3,1) forwards; animation-delay: var(--d, 0ms); }
@keyframes rise { to { opacity: 1; transform: none; } }

/* --- hero büyütme + scroll ipucu --- */
.hero { padding: 96px 0 40px; }
.hero h1 { font-size: clamp(2.9rem, 6.4vw, 4.9rem); letter-spacing: -0.035em; line-height: 1.04; }
.hero .lede { font-size: 1.14rem; }
.hero-lockup { animation: zkfloat 8s ease-in-out infinite; will-change: transform; }
.scroll-cue { display: grid; place-items: center; margin-top: 26px; }
.scroll-cue span {
  width: 26px; height: 42px; border: 2px solid var(--border); border-radius: 14px; position: relative;
}
.scroll-cue span::after {
  content: ""; position: absolute; left: 50%; top: 8px; width: 4px; height: 8px; border-radius: 2px;
  background: var(--accent); transform: translateX(-50%); animation: cue 1.8s ease-in-out infinite;
}
@keyframes cue { 0% { opacity: 0; transform: translate(-50%, 0); } 35% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 14px); } }

/* --- parlayan butonlar --- */
.btn { position: relative; overflow: hidden; }
.btn-shine::before {
  content: ""; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.42), transparent);
  transform: skewX(-18deg); transition: none;
}
.btn-shine:hover::before { animation: shine .85s ease; }
@keyframes shine { to { left: 130%; } }
.btn-primary { background: var(--grad); border-color: transparent; box-shadow: 0 10px 26px rgba(30,111,224,.28); }
.btn-primary:hover { background: var(--grad); filter: brightness(1.08); box-shadow: 0 16px 34px rgba(30,111,224,.38); }
.btn:active { transform: translateY(0) scale(.985); }

/* --- "ne yapıyorum" üçlüsü (logodaki ikonlara selam) --- */
.section-head.center { text-align: center; margin-left: auto; margin-right: auto; }
.section-head.center p { margin-left: auto; margin-right: auto; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.trio-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 32px 26px; text-align: center;
  transition: transform .32s cubic-bezier(.16,1,.3,1), box-shadow .32s ease, border-color .3s ease;
}
.trio-card:hover { transform: translateY(-7px); box-shadow: var(--shadow-lift); border-color: rgba(30,111,224,.5); }
.hexo {
  width: 76px; height: 84px; margin: 0 auto 18px; display: grid; place-items: center; color: var(--accent);
  background: var(--chip-bg);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  transition: transform .4s cubic-bezier(.16,1,.3,1), background-color .3s ease;
}
.trio-card:hover .hexo { transform: rotate(-6deg) scale(1.06); }
.hexo svg { width: 34px; height: 34px; }
.trio-card h3 { font-size: 1.12rem; margin-bottom: 8px; }
.trio-card p { color: var(--muted); font-size: .93rem; }

/* --- kendiliğinden kayan proje şeridi --- */
.showcase { overflow: hidden; }
.marquee {
  position: relative; overflow: hidden; padding: 8px 0 18px;
  cursor: grab; -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
}
.marquee.grabbing { cursor: grabbing; }
.marquee-track { display: flex; gap: 22px; width: max-content; will-change: transform; }
.marquee .project-card { width: 400px; flex: 0 0 400px; }
.marquee .project-media { height: 176px; }
.marquee.static { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.marquee.static .marquee-track { transform: none !important; }

/* --- yol şeklinde zaman çizelgesi --- */
.road { position: relative; padding: 10px 0 46px; }
.road-line {
  position: absolute; left: 50%; top: 0; bottom: 34px; width: 46px; transform: translateX(-50%);
  background: var(--chip-bg); border-radius: 26px;
  border-left: 2px solid var(--border); border-right: 2px solid var(--border);
}
.road-line i {
  position: absolute; left: 50%; top: 10px; bottom: 10px; width: 3px; transform: translateX(-50%);
  background: repeating-linear-gradient(var(--accent) 0 14px, transparent 14px 30px);
  opacity: .55;
}
.road-stop { position: relative; display: grid; grid-template-columns: 1fr 46px 1fr; align-items: center; gap: 0; margin-bottom: 26px; }
.road-dot { grid-column: 2; display: grid; place-items: center; z-index: 2; }
.road-dot span {
  display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%;
  background: var(--grad); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: .82rem;
  box-shadow: 0 8px 20px rgba(30,111,224,.34); border: 3px solid var(--surface);
  transition: transform .3s cubic-bezier(.16,1,.3,1);
}
.road-stop:hover .road-dot span { transform: scale(1.09); }
.road-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 15px 18px; font-size: .94rem; color: var(--text); box-shadow: var(--shadow);
  position: relative; transition: transform .3s ease, border-color .3s ease;
}
.road-stop:hover .road-card { border-color: rgba(30,111,224,.5); }
.road-stop.left .road-card { grid-column: 1; margin-right: 20px; }
.road-stop.left .road-card::after {
  content: ""; position: absolute; right: -7px; top: 50%; width: 12px; height: 12px;
  background: var(--surface); border-right: 1px solid var(--border); border-top: 1px solid var(--border);
  transform: translateY(-50%) rotate(45deg);
}
.road-stop.right .road-card { grid-column: 3; margin-left: 20px; }
.road-stop.right .road-card::after {
  content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px;
  background: var(--surface); border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
  transform: translateY(-50%) rotate(45deg);
}
.road-stop.left { --d: 0ms; }
.road-stop.left.reveal { transform: translateX(-24px); }
.road-stop.right.reveal { transform: translateX(24px); }
.road-stop.reveal.in { transform: none; }
.road-end {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 2px solid var(--border); color: var(--accent);
}
.road-end svg { width: 22px; height: 22px; }

/* --- kart hover'ları biraz daha canlı --- */
.card:hover { transform: translateY(-6px); }
.stat-v { font-variant-numeric: tabular-nums; }

/* --- koyu tema ek dokunuşlar --- */
[data-theme="dark"] .btn-shine::before { background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); }
[data-theme="dark"] .road-line { background: rgba(22,41,74,.55); }
[data-theme="dark"] .road-dot span { border-color: var(--surface); }
[data-theme="dark"] .trio-card:hover { border-color: rgba(77,151,245,.6); }

@media (max-width: 980px) {
  .trio { grid-template-columns: 1fr; }
  .marquee .project-card { width: 320px; flex: 0 0 320px; }
}
@media (max-width: 680px) {
  .hero { padding: 64px 0 24px; }
  .road-stop { grid-template-columns: 46px 1fr; }
  .road-line { left: 23px; transform: none; }
  .road-dot { grid-column: 1; }
  .road-stop.left .road-card, .road-stop.right .road-card { grid-column: 2; margin: 0 0 0 18px; }
  .road-stop.left .road-card::after { left: -7px; right: auto; border: none; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .road-end { left: 23px; transform: none; }
  .road-stop.left.reveal, .road-stop.right.reveal { transform: translateY(20px); }
  .marquee .project-card { width: 280px; flex: 0 0 280px; }
}
@media (prefers-reduced-motion: reduce) {
  .rise, .hero-lockup, .scroll-cue span::after { animation: none; opacity: 1; transform: none; }
  .reveal { opacity: 1; transform: none; transition: none; }
}

/* ================================================================
   v7 — TEK SAYFA akış: bölüm çapaları, hero fotoğrafı
   ================================================================ */
#sec-home, #sec-about, #sec-projects, #sec-blog, #sec-contact, #sec-do, #sec-showcase {
  scroll-margin-top: calc(var(--header-h) + 14px);
}
.anchor-sec { display: block; }

/* bölümler arası ince ayraç */
.anchor-sec + .anchor-sec > section { border-top: 1px solid var(--border); }
.anchor-sec > section { padding-top: 34px; }

/* --- hero fotoğrafı --- */
.hero-photo { position: relative; margin: 0; display: grid; place-items: center; }
.hero-photo img {
  width: min(78%, 340px); aspect-ratio: 1/1; object-fit: cover; border-radius: 50%;
  border: 5px solid var(--surface);
  box-shadow: 0 26px 60px rgba(30, 111, 224, .28);
  position: relative; z-index: 2;
  animation: zkfloat 8s ease-in-out infinite;
}
.photo-ring {
  position: absolute; z-index: 1; width: min(88%, 386px); aspect-ratio: 1/1; border-radius: 50%;
  background: conic-gradient(from 0deg, #16255f, #1e6fe0, #35c3f0, #1e6fe0, #16255f);
  filter: blur(2px); opacity: .55; animation: spin 14s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.photo-badge {
  position: absolute; z-index: 3; bottom: 6%; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 16px; font-size: .82rem; font-weight: 700; color: var(--heading);
  box-shadow: var(--shadow);
}
.dot-live { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: live 2s ease-out infinite; }
@keyframes live { to { box-shadow: 0 0 0 10px rgba(34,197,94,0); } }

/* --- about kartındaki logo (fotoğraf hero'da olduğu için) --- */
.profile-mark {
  width: 132px; height: 132px; margin: 0 auto 18px; border-radius: 26px;
  background: var(--chip-bg); display: grid; place-items: center; padding: 16px;
}
.profile-mark img { width: 100%; height: auto; }

/* --- aktif menü linki --- */
.main-nav a.active::after { transform: scaleX(1); }

@media (max-width: 980px) {
  .hero-photo img { width: min(62%, 290px); }
  .photo-ring { width: min(70%, 330px); }
}
@media (max-width: 680px) {
  .anchor-sec > section { padding-top: 20px; }
  .photo-badge { font-size: .74rem; padding: 6px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-photo img, .photo-ring, .dot-live { animation: none; }
}

/* ================================================================
   v8 — Metne gömülü fotoğraflar + kayan şerit
   ================================================================ */

/* --- kayan yazı şeridi --- */
.ticker {
  overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  background: var(--surface); padding: 16px 0; margin-top: 10px;
}
.ticker-track {
  display: flex; align-items: center; gap: 26px; width: max-content;
  animation: tick 34s linear infinite;
}
.ticker-track span {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 2vw, 1.35rem);
  text-transform: lowercase; letter-spacing: -0.01em; color: var(--heading); white-space: nowrap;
}
.ticker-track i { color: var(--accent); font-style: normal; font-size: .9rem; }
@keyframes tick { to { transform: translateX(-33.333%); } }

/* --- metne gömülü fotoğraflı anlatım --- */
.intro-tell { padding: 74px 0 60px; }
.tell {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.5rem, 3.5vw, 2.55rem); line-height: 1.42;
  letter-spacing: -0.025em; color: var(--heading); max-width: 22ch;
  max-width: min(100%, 20em);
}
.inline-shot {
  display: inline-block; vertical-align: middle;
  width: clamp(74px, 9vw, 128px); aspect-ratio: 4/3;
  border-radius: 14px; overflow: hidden; margin: 0 .18em; 
  box-shadow: 0 10px 24px rgba(30,111,224,.22);
  transform: rotate(-2.2deg);
  transition: transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s ease;
}
.inline-shot:nth-of-type(2n) { transform: rotate(2.4deg); }
.inline-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.inline-shot:hover { transform: rotate(0deg) scale(1.5); box-shadow: 0 22px 44px rgba(30,111,224,.34); z-index: 5; position: relative; }

/* --- hakkımda hikâye kapağı --- */
.story-cover {
  margin: 0 0 18px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border);
}
.story-cover img { width: 100%; height: auto; display: block; }

[data-theme="dark"] .inline-shot { box-shadow: 0 10px 26px rgba(0,0,0,.5); }
[data-theme="dark"] .ticker { background: rgba(17,29,51,.6); }

@media (max-width: 680px) {
  .intro-tell { padding: 44px 0 34px; }
  .tell { font-size: 1.32rem; line-height: 1.5; }
  .inline-shot { width: 66px; }
  .inline-shot:hover { transform: rotate(0) scale(1.2); }
}
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

</style>

      "title": "Building a RAG Assistant on Top of a Clinical Triage Model",
      "date": "2026-06-15",
      "excerpt": "How I combined an XGBoost triage classifier trained on MIMIC-IV-ED with a LangChain RAG layer so operators can question the system in plain language.",
      "cover": "",
      "body": "Emergency departments generate enormous amounts of structured and unstructured data. In my graduation project I trained an XGBoost classifier on the MIMIC-IV-ED dataset, combining vital signs with TF-IDF features extracted from chief-complaint text, and reached an official 59.52% accuracy across the five ESI priority levels.\n\nThe interesting part came after the model: operators do not read confusion matrices. So I wrapped the pipeline with a Retrieval-Augmented Generation assistant built on LangChain. The knowledge base indexes model outputs, feature importances (via SHAP) and operational metadata, letting a nurse ask 'why was this patient marked level 2?' and get a grounded, cited answer.\n\nKey lessons: keep the retrieval corpus small and structured, log every generation next to its retrieved chunks for auditability, and never let the LLM override the classifier — it explains decisions, it does not make them."

      "date": "2026-05-02",
      "excerpt": "A compact recipe for streaming factory sensor data into live dashboards, based on my Industry 4.0 internship work.",
      "cover": "",
      "body": "During my internship at Software Persona I kept rebuilding the same pattern: a sensor publishes to an MQTT topic, a small Python bridge subscribes and writes to InfluxDB, and Grafana turns the series into a live panel with alert thresholds.\n\nThe whole bridge fits in about forty lines of Python with paho-mqtt and influxdb-client. The details that matter in production: use QoS 1 for measurements that feed alerts, batch writes to Influx every few seconds instead of per-message, and tag every point with machine ID and line ID so Grafana variables can slice the fleet.\n\nOnce the pipeline exists, predictive maintenance models plug in naturally — the same bridge that feeds the dashboard also feeds the feature store."

  "about_story": {
    "en": "My path into software started in 2022 at Bandırma Onyedi Eylül University, where I chose Software Engineering because I wanted to build systems that actually run in the real world — not just on slides.\n\nThe turning point was my first internship at HOSTİNG.COM in Izmir: integrating payment operators and domain registrar APIs in PHP taught me that production code is about reliability, edge cases and debugging discipline as much as it is about features.\n\nFrom there I moved toward data and intelligence. At Software Persona in Istanbul I worked on Industry 4.0 problems: sensor data pipelines, fault-prediction models with TensorFlow/PyTorch, computer-vision quality control with OpenCV, and MQTT-connected automation interfaces in C#.\n\nIn parallel, I have been completing a second degree in Management Information Systems at Anadolu University, which keeps me close to the business side of technology: processes, optimization and decision-making.\n\nMy graduation project brings it all together — a clinical triage AI trained on the MIMIC-IV-ED dataset, wrapped with a LangChain RAG assistant so that operators can question the system in natural language.\n\nWhat drives me is the same in every project: turning raw data into systems that make better decisions, and making those systems robust enough to trust.",
    "tr": "Yazılım yolculuğum 2022'de Bandırma Onyedi Eylül Üniversitesi'nde başladı; Yazılım Mühendisliği'ni, sadece sunumlarda değil gerçek dünyada çalışan sistemler kurmak istediğim için seçtim.\n\nDönüm noktası İzmir'de HOSTİNG.COM'daki ilk stajımdı: PHP ile ödeme operatörleri ve alan adı tescil API'lerini entegre etmek, üretim kodunun özellik kadar güvenilirlik, uç durumlar ve hata ayıklama disiplini demek olduğunu öğretti.\n\nOradan veri ve yapay zekâya yöneldim. İstanbul'da Software Persona'da Endüstri 4.0 problemleri üzerinde çalıştım: sensör veri hatları, TensorFlow/PyTorch ile arıza tahmin modelleri, OpenCV ile görüntü işleme tabanlı kalite kontrol ve C# ile MQTT bağlantılı otomasyon arayüzleri.\n\nParalelde Anadolu Üniversitesi'nde Yönetim Bilişim Sistemleri ikinci lisansımı sürdürüyorum; bu da beni teknolojinin iş tarafına — süreçlere, optimizasyona ve karar almaya — yakın tutuyor.\n\nBitirme projem hepsini birleştiriyor: MIMIC-IV-ED veri kümesiyle eğitilmiş bir klinik triyaj yapay zekâsı ve operatörlerin sisteme doğal dille soru sorabilmesi için LangChain tabanlı bir RAG asistanı.\n\nHer projede beni motive eden şey aynı: ham veriyi daha iyi karar veren sistemlere dönüştürmek ve bu sistemleri güvenilecek kadar sağlam yapmak."

  function contactSection(bare) {
    const t = T();
    return `
    <section class="section" id="contact" ${bare ? 'style="padding-top:0"' : ""}><div class="wrap">
      <div class="contact-frame reveal"><div class="contact-card">
        ${bare ? `<p style="color:var(--muted);margin-bottom:18px">${t.contactSub}</p>` : `<div class="section-head" style="margin-bottom:20px">
          <span class="eyebrow">${t.contactEyebrow}</span>
          <h2>${t.contactTitle}</h2>
          <p>${t.contactSub}</p>
        </div>`}
        <div class="contact-grid">
          <input type="text" id="cf-name" placeholder="${t.f_name}" autocomplete="name">
          <input type="email" id="cf-email" placeholder="${t.f_email}" autocomplete="email">
          <input type="text" id="cf-subject" class="cf-wide" placeholder="${t.f_subject}">
          <textarea id="cf-msg" placeholder="${t.f_msg}"></textarea>
          <button class="btn btn-primary" id="cf-send">${t.f_send}</button>
          <p class="cf-status" id="cf-status"></p>
        </div>
      </div></div>
    </div></section>`;
  }
  function bindContact() {
    const btn = document.getElementById("cf-send");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const t = T();
      const name = document.getElementById("cf-name").value.trim();
      const email = document.getElementById("cf-email").value.trim();
      const subject = document.getElementById("cf-subject").value.trim();
      const msg = document.getElementById("cf-msg").value.trim();
      const status = document.getElementById("cf-status");
      if (!name || !email || !msg) { status.textContent = t.f_fill; status.className = "cf-status err"; return; }
      const body = new URLSearchParams({ "form-name": "contact", name, email, subject, message: msg }).toString();
      try {
        const res = await fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        status.textContent = t.f_ok; status.className = "cf-status ok";
        document.getElementById("cf-name").value = "";
        document.getElementById("cf-email").value = "";
        document.getElementById("cf-msg").value = "";
        document.getElementById("cf-subject").value = "";
      } catch (e) {
        status.textContent = t.f_err; status.className = "cf-status err";
        location.href = `mailto:${DATA.contact.email}?subject=${encodeURIComponent(subject || ("Portfolio message from " + name))}&body=${encodeURIComponent(msg + "\n\n— " + name + " (" + email + ")")}`;
      }
    });
  }

  /* ================================================================
     ADMIN (identical mechanics, i18n-aware fields)
     ================================================================ */
  async function sha256(str) {
    if (window.crypto && crypto.subtle) {
      try {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) { /* fall through */ }
    }
    return sha256js(unescape(encodeURIComponent(str)));
  }
  function sha256js(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    const mathPow = Math.pow, maxWord = mathPow(2, 32);
    let result = "", words = [], asciiBitLength = ascii.length * 8;
    let hash = sha256js.h = sha256js.h || [], k = sha256js.k = sha256js.k || [], primeCounter = k.length;
    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += "\x80";
    while (ascii.length % 64 - 56) ascii += "\x00";
    for (let i = 0; i < ascii.length; i++) {
      const j = ascii.charCodeAt(i);
      if (j >> 8) return "";
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;
    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16), oldHash = hash.slice(0, 8);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const temp1 = hash[7]
          + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
          + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        const temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (let i = 0; i < 8; i++)
      for (let j = 3; j + 1; j--) {
        const b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : "") + b.toString(16);
      }
    return result;
  }

  function bindAdmin() {
    const $ = (s, el = document) => el.querySelector(s);
    if (SS.getItem("zk-admin") !== "1") {
      const tryLogin = async () => {
        const h = await sha256($("#gate-pass").value);

        else $("#gate-err").textContent = "Şifre yanlış.";

      $("#gate-btn").addEventListener("click", tryLogin);
      $("#gate-pass").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
      $("#gate-pass").focus();
      return;
    }

    AD = AD || JSON.parse(JSON.stringify(DATA));
    let toastT;
    const toast = (msg) => {
      const t = $("#toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3000);
    };

    function pickImage(cb, maxW = 1400, quality = 0.82) {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = "image/*";
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL("image/jpeg", quality));
        };
        img.src = URL.createObjectURL(f);
      };
      inp.click();
    }
    function pickPdf(cb) {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = "application/pdf";
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        if (f.size > 4 * 1024 * 1024) { toast("PDF 4 MB'den küçük olmalı."); return; }
        const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(f);
      };
      inp.click();
    }

    function getPath(obj, path) {
      return path.split(".").reduce((o, k) => o == null ? o : o[isNaN(k) ? k : +k], obj);
    }
    function setPath(obj, path, val) {
      const parts = path.split(".");
      let o = obj;
      for (let i = 0; i < parts.length - 1; i++) o = o[isNaN(parts[i]) ? parts[i] : +parts[i]];
      o[parts[parts.length - 1]] = val;
    }
    const F = (label, value, path, type = "text") =>
      `<label>${label}</label><input type="${type}" data-path="${path}" value="${esc(value)}">`;
    const F2 = (label, obj, base) => `
      <label>${label}</label>
      <div class="row2">
        <input type="text" data-path="${base}.en" value="${esc(obj && obj.en || "")}" placeholder="🇬🇧 English">
        <input type="text" data-path="${base}.tr" value="${esc(obj && obj.tr || "")}" placeholder="🇹🇷 Türkçe">
      </div>`;
    const T2 = (label, obj, base) => `
      <label>${label}</label>
      <div class="row2">
        <textarea data-path="${base}.en" placeholder="🇬🇧 English">${esc(obj && obj.en || "")}</textarea>
        <textarea data-path="${base}.tr" placeholder="🇹🇷 Türkçe">${esc(obj && obj.tr || "")}</textarea>
      </div>`;
    const Tx = (label, value, path, hint = "") =>
      `<label>${label}</label><textarea data-path="${path}">${esc(value)}</textarea>${hint ? `<p class="hint">${hint}</p>` : ""}`;
    function bindInputs(root) {
      root.querySelectorAll("[data-path]").forEach(el => {
        if (el.dataset.path.indexOf("__") === 0) return;
        el.addEventListener("input", () => {
          // ensure i18n parent object exists
          const parts = el.dataset.path.split(".");
          if (parts[parts.length - 1] === "en" || parts[parts.length - 1] === "tr") {
            const parentPath = parts.slice(0, -1).join(".");
            if (getPath(AD, parentPath) == null || typeof getPath(AD, parentPath) !== "object")
              setPath(AD, parentPath, { en: "", tr: "" });
          }
          setPath(AD, el.dataset.path, el.value);
        });
      });
    }

  const norm = (s) => s.toLowerCase()
    .replace(/ı/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g")
    .replace(/ü/g, "u").replace(/ö/g, "o").replace(/ç/g, "c");
  function isTurkish(q) {
    if (/[ışğüöçİ]/.test(q) ||
      /\b(nedir|nerede|neler|hangi|kim(dir)?|nasil|proje\w*|calis\w*|okul\w*|dil(ler\w*)?|beceri\w*|yetenek\w*|staj\w*|deneyim\w*|iletisim\w*|mezun\w*|universite\w*|hakkinda|anlat)\b/i.test(norm(q))) return true;
    if (/\b(what|who|where|when|which|how|does|do|is|are|can|her|she|show|tell|about)\b/i.test(q)) return false;
    return LANG === "tr";
  }
  /* private-information guard */
  const PRIVATE_RE = /\b(telefon\w*|numaras?i?\b|phone|gsm|whatsapp|adres\w*|address|nerede (yasiyor|oturuyor|kaliyor)|where does (she|zeliha) live|home town|dogum\w*|birth ?date|birthday|kac yasinda|yasi kac|how old|age\b|tc\b|tckn|kimlik\w*|national id|passport|pasaport|evli\s*mi|bekar\s*mi|sevgili\w*|boyfriend|girlfriend|iliskisi|relationship status|maas\w*|salary|kazanc\w*|income|instagram|facebook|snapchat|tiktok|okul numara\w*|ogrenci numara\w*|student (id|number)|sifre\w*|password)\b/i;

  function answer(q) {
    const D = DATA;
    const nq = norm(q);
    const tr = isTurkish(q);
    const has = (...words) => words.some(w => nq.includes(w));

    if (PRIVATE_RE.test(nq)) {
      return tr
        ? `Kişisel ve özel bilgileri paylaşamıyorum. 🙂 Zeliha'ya ulaşmak isterseniz e-posta (${D.contact.email}) veya LinkedIn kullanabilirsiniz; sayfadaki Görüş & İletişim formunu da doldurabilirsiniz.`
        : `I can't share personal or private information. 🙂 To reach Zeliha, please use email (${D.contact.email}) or LinkedIn — or the Feedback & Contact form on this site.`;
    }
    if (has("graduation", "thesis", "bitirme", "triage", "triyaj", "mimic", "capstone")) {
      const p = D.projects.find(x => x.id === "smart-triage") || D.projects[0];
      return tr
        ? `Zeliha'nın bitirme projesi "${L(p.title)}". ${p.what_i_did.tr} ${p.core_features.tr} Teknolojiler: ${p.tags.join(", ")}.`
        : `Zeliha's graduation project is "${p.title.en}". ${p.what_i_did.en} ${p.core_features.en} Tech: ${p.tags.join(", ")}.`;
    }
    if (has("skill", "beceri", "yetenek", "teknoloji", "stack", "tool", "arac", "bilgisayar")) {
      const lines = D.skills.map(c => `• ${tr ? c.category.tr : c.category.en}: ${c.items.join(", ")}`).join("\n");
      return (tr ? "Zeliha'nın teknik becerileri:\n" : "Zeliha's core software skills:\n") + lines;
    }
    if (has("work", "job", "intern", "staj", "deneyim", "experience", "calis", "company", "sirket", "career")) {
      const lines = D.experience.map(x => `• ${tr ? x.role.tr : x.role.en} — ${x.company} (${tr ? x.location.tr : x.location.en}, ${x.period})${x.focus ? ": " + (tr ? x.focus.tr : x.focus.en) : ""}`).join("\n");
      return (tr ? "İş deneyimi:\n" : "Work experience:\n") + lines;
    }
    if (has("education", "egitim", "university", "universite", "okul", "school", "study", "gpa", "ortalama", "mezun", "degree")) {
      const lines = D.education.map(e => `• ${e.institution} — ${tr ? e.degree.tr : e.degree.en} (${e.years})${e.gpa ? ", " + (tr ? "Ortalama" : "GPA") + " " + e.gpa : ""}`).join("\n");
      return (tr ? "Eğitim bilgileri:\n" : "Education:\n") + lines;
    }
    if (has("language", "dil", "english", "german", "ingilizce", "almanca", "speak", "konus")) {
      const lines = D.personal_info.languages.map(lg => `• ${tr ? lg.name.tr : lg.name.en}: ${tr ? lg.level.tr : lg.level.en}`).join("\n");
      return (tr ? "Konuştuğu diller:\n" : "Languages:\n") + lines;
    }
    if (has("contact", "iletisim", "email", "mail", "linkedin", "github", "reach", "ulas")) {
      return (tr ? "İletişim:\n" : "Contact:\n") +
        `• Email: ${D.contact.email}\n• LinkedIn: ${D.contact.linkedin}\n• GitHub: ${D.contact.github}` +
        (tr ? "\n\nSayfadaki Görüş & İletişim formunu da kullanabilirsiniz." : "\n\nYou can also use the Feedback & Contact form on this site.");
    }
    if (has("blog", "article", "yazi", "makale", "post")) {
      const lines = (D.blog || []).map(b => `• ${b.title} (${b.date})`).join("\n");
      return (tr ? "Blog yazıları:\n" : "Blog articles:\n") + (lines || (tr ? "Henüz yazı yok." : "No articles yet."));
    }
    const pHit = D.projects.find(p => norm(L(p.title) + " " + p.tags.join(" ")).split(/\W+/).some(w => w.length > 3 && nq.includes(w)));
    if (pHit && has("project", "proje", ...pHit.tags.map(x => norm(x)))) {
      return tr
        ? `"${pHit.title.tr}" — Amaç: ${pHit.objective.tr} Yaptıkları: ${pHit.what_i_did.tr} Teknolojiler: ${pHit.tags.join(", ")}.`
        : `"${pHit.title.en}" — Objective: ${pHit.objective.en} What she did: ${pHit.what_i_did.en} Tech: ${pHit.tags.join(", ")}.`;
    }
    if (has("project", "proje", "portfolio", "yapti", "built")) {
      const lines = D.projects.map(p => `• ${tr ? p.title.tr : p.title.en} [${p.tags.slice(0, 3).join(", ")}]`).join("\n");
      return (tr ? "Öne çıkan projeler:\n" : "Flagship projects:\n") + lines +
        (tr ? "\n\nBir projenin adını yazarsanız detayını anlatayım." : "\n\nAsk about any of them by name for details.");
    }
    if (has("who", "kim", "hakkinda", "about", "zeliha")) {
      return tr
        ? `${D.personal_info.name} bir yazılım mühendisi. ${D.site.hero_paragraph.tr}`
        : `${D.personal_info.name} is a software engineer. ${D.site.hero_paragraph.en}`;
    }
    return tr
      ? "Bu bilgi portfolyo verisinde yok. Şunları sorabilirsiniz: projeler, beceriler, eğitim, staj deneyimi, diller veya iletişim."
      : "I can only answer from Zeliha's portfolio data. Try asking about her projects, skills, education, experience, languages or contact info.";
  }

  /* ---------- hareket motoru ---------- */
  const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mountMarquee() {
    const track = document.getElementById("proj-track");
    const box = document.getElementById("proj-marquee");
    if (!track || !box) return;
    const cards = [].slice.call(track.children);
    if (!cards.length) return;

    // kesintisiz döngü için kartları iki kez daha kopyala
    for (let pass = 0; pass < 2; pass++) {
      cards.forEach(c => {
        const clone = c.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        clone.classList.add("in");
        track.appendChild(clone);
      });
    }
    cards.forEach(c => c.classList.add("in"));

    if (REDUCED) { box.classList.add("static"); return; }

    let x = 0, paused = false, dragging = false, startX = 0, startOff = 0, last = 0;
    const speed = 0.035; // px / ms
    const width = () => track.scrollWidth / 3;

    box.addEventListener("mouseenter", () => { paused = true; });
    box.addEventListener("mouseleave", () => { paused = false; });
    box.addEventListener("focusin", () => { paused = true; });
    box.addEventListener("focusout", () => { paused = false; });

    const down = (e) => {
      dragging = true; paused = true; box.classList.add("grabbing");
      startX = (e.touches ? e.touches[0].clientX : e.clientX); startOff = x;
    };
    const move = (e) => {
      if (!dragging) return;
      const cx = (e.touches ? e.touches[0].clientX : e.clientX);
      x = startOff + (cx - startX);
      apply();
    };
    const up = () => { dragging = false; paused = false; box.classList.remove("grabbing"); };
    box.addEventListener("mousedown", down);
    box.addEventListener("touchstart", down, { passive: true });
    window.addEventListener("mousemove", move);
    box.addEventListener("touchmove", move, { passive: true });
    window.addEventListener("mouseup", up);
    box.addEventListener("touchend", up);

    function apply() {
      const w = width();
      if (w > 0) { while (x <= -w) x += w; while (x > 0) x -= w; }
      track.style.transform = "translate3d(" + x + "px,0,0)";
    }
    function step(ts) {
      if (!document.getElementById("proj-track")) return; // sayfa değişti
      const dt = last ? Math.min(ts - last, 48) : 16;
      last = ts;
      if (!paused && !dragging) { x -= speed * dt; apply(); }
      requestAnimationFrame(step);
    }
    apply();
    requestAnimationFrame(step);
  }

  function runCounters(scope) {
    (scope || document).querySelectorAll("[data-count]").forEach(el => {
      if (el.dataset.done) return;
      const raw = el.dataset.count || "";
      const num = parseFloat(raw.replace(/[^0-9.]/g, ""));
      if (!isFinite(num) || num <= 0) return;
      const suffix = raw.replace(/[0-9.,]/g, "");
      el.dataset.done = "1";
      if (REDUCED) return;
      const dur = 1100, t0 = performance.now();
      el.textContent = "0" + suffix;
      (function tick(now) {
        const p = Math.min((now - t0) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(num * eased) + suffix;
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = raw;
      })(t0);
    });
  }

  function observeReveals() {
    if (!("IntersectionObserver" in window)) {
      document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
      runCounters();
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        if (e.target.classList.contains("stats-grid") || e.target.querySelector("[data-count]")) runCounters(e.target);
        if (e.target.hasAttribute("data-count")) runCounters(e.target.parentNode);
        io.unobserve(e.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  }

      });
      document.body.appendChild(topBtn);
      window.addEventListener("scroll", function () {
        topBtn.classList.toggle("show", window.pageYOffset > 420);
      });
    }
    topBtn.setAttribute("aria-label", T().topAria);
    topBtn.style.display = document.body.classList.contains("admin-mode") ? "none" : "";
  }

  /* ---------- router ---------- */
  let roleTimer = null;
  function startRoleRotation() {
    clearInterval(roleTimer);
    const roles = DATA.site.roles || [];
    if (roles.length < 2) return;
    let i = 0;
    roleTimer = setInterval(() => {
      const el = document.getElementById("hero-role");
      if (!el) { clearInterval(roleTimer); return; }
      i = (i + 1) % roles.length;
      el.classList.add("swap");
      setTimeout(() => { el.textContent = L(roles[i]); el.classList.remove("swap"); }, 240);
    }, 2600);
  }

  function render() {
    applyTheme();
    const { name: r, param } = routeParts();
    const isAdmin = r === "admin";
    document.body.classList.toggle("admin-mode", isAdmin);
    mountToTop();
    let rebuiltMain = false;

    if (isAdmin) {
      VIEW = "admin";
      app.innerHTML = pageAdmin();
      bindAdmin();
    } else {
      const SECTIONS = { home: "sec-home", about: "sec-about", projects: "sec-projects", blog: "sec-blog", contact: "sec-contact" };
      const isSection = Object.prototype.hasOwnProperty.call(SECTIONS, r);
      let body, active, scrollTo = null, rebuilt = true;

      if (r === "project") { body = pageProjectDetail(param); active = "projects"; VIEW = "detail"; }
      else if (r === "post") { body = pagePostDetail(param); active = "blog"; VIEW = "detail"; }
      else {
        active = isSection ? r : "home";
        scrollTo = SECTIONS[active];
        if (VIEW === "main" && document.getElementById("sec-home")) {
          rebuilt = false;                       // sayfa zaten açık: sadece kaydır
        } else { body = pageMain(); VIEW = "main"; rebuiltMain = true; }
      }

      if (rebuilt) {
        app.innerHTML = shellHeader(active) + `<main>${body}</main>` + shellFooter();
      } else {
        markActiveNav(active);
      }
      if (rebuilt) {
        const t = document.getElementById("nav-toggle");
        if (t) t.addEventListener("click", () => document.getElementById("main-nav").classList.toggle("open"));
        document.querySelectorAll(".lang-toggle button").forEach(b => {
          b.addEventListener("click", () => {
            if (LANG === b.dataset.lang) return;
            LANG = b.dataset.lang;
            LS.setItem("zk-lang", LANG);
            VIEW = null; render();
          });
        });
        const tt = document.getElementById("theme-toggle");
        if (tt) tt.addEventListener("click", toggleTheme);
        document.querySelectorAll(".main-nav a[data-sec]").forEach(a => {
          a.addEventListener("click", () => {
            const nav = document.getElementById("main-nav");
            if (nav) nav.classList.remove("open");
          });
        });
        bindContact();
      }
      mountChat();
      if (VIEW === "main") startRoleRotation(); else clearInterval(roleTimer);

      // menüden gelen bölüme kaydır
      if (VIEW === "main") {
        const target = scrollTo && document.getElementById(scrollTo);
        if (target && scrollTo !== "sec-home") {
          setTimeout(() => scrollToEl(target), rebuilt ? 60 : 0);
        } else if (rebuilt) {
          window.scrollTo(0, 0);
        } else {
          scrollToEl(document.body, true);
        }
      } else {
        window.scrollTo(0, 0);
      }
    }

    observeReveals();
    if (!isAdmin && VIEW === "main" && rebuiltMain) { mountMarquee(); mountScrollSpy(); }
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", render);
  if (document.readyState !== "loading") render();
})();


</script>
</body>
</html>
