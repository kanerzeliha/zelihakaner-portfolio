.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

.card {

}

.bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }

.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
.pill {

.gpa-badge { display: inline-block; margin-top: 6px; background: var(--chip-bg); color: var(--chip-text); font-weight: 700; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px; }

.xp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }

.xp-company { display: inline-flex; align-items: center; gap: 12px; max-width: 100%; }
.xp-logo { width: auto; height: 60px; max-width: 160px; object-fit: contain; flex: 0 0 auto; }
.xp-sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
.xp-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.xp-list li { padding-left: 22px; position: relative; font-size: 0.95rem; color: var(--text); }
.xp-list li::before { content: ""; position: absolute; left: 0; top: 9px; width: 8px; height: 8px; border-radius: 3px; background: var(--accent); }
.xp-list li strong { color: var(--heading); }

.skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.skill-cat h4 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--heading); margin-bottom: 10px; }
.lang-row { display: flex; gap: 16px; flex-wrap: wrap; }
.lang-badge {
  flex: 1; min-width: 200px; display: flex; align-items: center; gap: 14px;
  border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: var(--surface);
}
.lang-badge .flag { width: 42px; height: 42px; border-radius: 12px; background: var(--chip-bg); display: grid; place-items: center; color: var(--accent); font-weight: 800; font-family: var(--font-display); }
.lang-badge h5 { color: var(--heading); font-size: 1rem; }
.lang-badge span { color: var(--muted); font-size: 0.85rem; }

.blog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
.post-card { overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.post-body { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.post-date { color: var(--accent); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
.post-body h3 { font-size: 1.2rem; }
.post-body p { color: var(--muted); font-size: 0.94rem; }
.read-more { color: var(--accent); font-weight: 700; font-size: 0.9rem; margin-top: auto; padding-top: 8px; width: fit-content; border-bottom: 2px solid transparent; transition: color .2s ease, border-color .2s ease, transform .2s ease; }
.project-card:hover .read-more, .read-more:hover { color: var(--accent-hover); border-bottom-color: currentColor; transform: translateX(3px); }
.post-card:hover .read-more { color: var(--accent-hover); }

.reader-overlay {
  position: fixed; inset: 0; z-index: 90; background: rgba(61,47,92,0.35);
  backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center;
  padding: 6vh 20px; overflow-y: auto;
}
.reader-overlay.open { display: flex; }
.reader {
  background: var(--surface); border-radius: var(--radius); max-width: 760px; width: 100%;
  padding: 44px; box-shadow: var(--shadow-lift); position: relative;
}
.reader h2 { margin: 8px 0 20px; }
.reader .body { white-space: pre-wrap; color: var(--text); font-size: 1rem; }
.reader-close {
  position: absolute; top: 18px; right: 18px; width: 38px; height: 38px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  font-size: 1rem; color: var(--heading);
}
.reader-close:hover { border-color: var(--accent); color: var(--accent); }

.chat-fab {
  position: fixed; right: 26px; bottom: 26px; z-index: 80;
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  box-shadow: 0 14px 34px rgba(111,91,163,.4);
  display: grid; place-items: center;
  transition: transform .2s ease, background .2s ease;
}
.chat-fab:hover { background: var(--accent-hover); transform: translateY(-3px); }
.chat-panel {
  position: fixed; right: 26px; bottom: 100px; z-index: 80;
  width: 372px; max-width: calc(100vw - 40px); height: 520px; max-height: 70vh;
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: var(--shadow-lift);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(16px) scale(.97); opacity: 0; pointer-events: none;
  transition: transform .26s cubic-bezier(.2,.9,.3,1.2), opacity .22s ease;
}
.chat-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.chat-head {
  background: var(--heading); color: #fff; padding: 16px 18px;
  display: flex; align-items: center; gap: 12px;
}
.chat-head img { height: 30px; }
.chat-head h4 { color: #fff; font-size: 0.98rem; }
.chat-head span { font-size: 0.75rem; color: #a9c6f2; }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; white-space: pre-wrap; }
.msg.bot { background: var(--chip-bg); color: var(--text); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.user { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.chat-pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
.chat-pills button {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  font-size: 0.76rem; padding: 6px 12px; color: var(--heading);
  transition: border-color .15s, color .15s;
}
.chat-pills button:hover { border-color: var(--accent); color: var(--accent); }
.chat-input { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid rgba(173,181,189,.4); }
.chat-input input {
  flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
  font-family: inherit; font-size: 0.9rem; outline: none; background: var(--bg); color: var(--text);
}
.chat-input input:focus { border-color: var(--accent); }
.chat-input button { background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 0 16px; font-weight: 700; }
.chat-input button:hover { background: var(--accent-hover); }

.site-notice { display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--chip-bg); color: var(--heading); padding: 12px 22px; font-size: .88rem; text-align: center; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-width: fit-content; margin: 14px auto 0; }
.site-notice button { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; line-height: 1; }
.site-notice button:hover { color: var(--heading); }
.site-footer { border-top: 1px solid rgba(173,181,189,.35); margin-top: 40px; }
.site-footer .wrap { padding: 34px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.site-footer p { color: var(--muted); font-size: 0.88rem; }
.footer-logo { height: 40px; filter: none; background: var(--heading); padding: 8px 14px; border-radius: 12px; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  * { animation: none !important; }
}

@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; gap: 36px; }
  .bento { grid-template-columns: 1fr 1fr; }
  .bento .span-2, .bento .span-4 { grid-column: span 2; }
  .about-grid { grid-template-columns: 1fr; }
  .about-sticky { position: static; }
}
@media (max-width: 680px) {
  .main-nav {
    display: none; position: absolute; top: var(--header-h); left: 0; right: 0;
    background: rgba(248,249,250,.97); flex-direction: column; gap: 0;
    border-bottom: 1px solid rgba(173,181,189,.4); padding: 10px 28px 18px;
  }
  .main-nav.open { display: flex; }
  .main-nav a { padding: 12px 0; }
  .nav-toggle { display: block; }
  .bento, .blog-grid, .edu-grid, .skills-grid { grid-template-columns: 1fr; }
  .bento .span-2, .bento .span-4 { grid-column: span 1; }
  .reader { padding: 28px 20px; }
}

body.admin-mode { padding-bottom: 80px; background-image: none !important; background-color: var(--surface); }
body.admin-mode::before, body.admin-mode::after { display: none !important; }
[data-theme="dark"] body.admin-mode { background-color: #17121f; }
.admin-bar { position: sticky; top: 0; z-index: 50; background: var(--deep); color: #fff; padding: 14px 0; }
.admin-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.admin-bar h1 { color: #fff; font-size: 1.1rem; }
.admin-bar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.abtn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: .85rem; cursor: pointer; }
.abtn.save { background: var(--accent); color: #fff; }
.abtn.save:hover { background: var(--accent-hover); }
.abtn.publish { background: #fff; color: var(--heading); }
.abtn.danger { background: transparent; color: #ffb4b4; border: 1px solid #ffb4b4; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 20px; }
.tabs button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: .88rem; color: var(--heading); }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.panel { display: none; }
.panel.active { display: block; }
.fcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 18px; }
.fcard h3 { font-size: 1rem; margin-bottom: 14px; color: var(--heading); }
.fcard label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 5px; }
.fcard input[type=text], .fcard input[type=date], .fcard input[type=password], #gate input[type=password], .fcard textarea, .fcard select {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px;
  font-family: inherit; font-size: .93rem; background: var(--bg); color: var(--text); outline: none;
}
.fcard input:focus, .fcard textarea:focus, .fcard select:focus, #gate input:focus { border-color: var(--accent); }
.fcard textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.mini { font-size: .78rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; cursor: pointer; }
.mini.del { color: #c0392b; border-color: #e3b1ab; }
.mini.add { color: var(--accent); border-color: var(--accent); }
.thumb { height: 90px; border-radius: 10px; border: 1px solid var(--border); object-fit: cover; margin-top: 8px; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--deep); color: #fff; padding: 12px 22px; border-radius: 12px; font-size: .9rem; transition: transform .3s ease; z-index: 99; }
.toast.show { transform: translateX(-50%) translateY(0); }
#gate { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: grid; place-items: center; }
#gate .fcard { width: 360px; max-width: 90vw; text-align: center; }
#gate img { height: 54px; margin: 0 auto 14px; background: var(--heading); border-radius: 12px; padding: 8px 14px; }
@media (max-width: 680px) { .row2 { grid-template-columns: 1fr; } }

.hero-visual .node { fill: #6f5ba3; }
.hero-visual .node.alt { fill: #6b5a99; }
.hero-visual .pulse { animation: zkpulse 2.6s ease-in-out infinite; }

.hero-visual .pulse.d2 { animation-delay: 1s; }
.hero-visual .pulse.d3 { animation-delay: 1.6s; }
@keyframes zkpulse { 0%,100% { r: 6; } 50% { r: 10; } }
.hero-visual .float { animation: zkfloat 7s ease-in-out infinite; }

  .road-stop.left .road-card::after { left: -7px; right: auto; border: none; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .road-end { left: 23px; transform: none; }
  .road-stop.left.reveal, .road-stop.right.reveal { transform: translateY(20px); }
  .marquee .project-card { width: 280px; flex: 0 0 280px; }
}
@media (max-width: 420px) {
  .wrap { padding-left: 18px; padding-right: 18px; }
  .site-header .wrap { gap: 10px; }
  .logo-chip img { max-width: 150px; height: 32px; }
  .main-nav { padding-left: 18px; padding-right: 18px; max-height: calc(100vh - var(--header-h)); overflow-y: auto; }
  .marquee { padding-left: 18px; padding-right: 18px; -webkit-mask-image: none; mask-image: none; }
  .marquee .project-card { width: calc(100vw - 36px); flex-basis: calc(100vw - 36px); }
  .project-body { padding: 20px; }
  .road { overflow: hidden; }
  .road-stop { grid-template-columns: 42px minmax(0, 1fr); }
  .road-line, .road-end { left: 21px; }
  .road-dot span { width: 52px; height: 52px; font-size: .74rem; }
  .road-stop.left .road-card, .road-stop.right .road-card { min-width: 0; margin-left: 14px; padding: 13px 14px; overflow-wrap: anywhere; }
  .chat-fab { right: 16px; bottom: 16px; width: 54px; height: 54px; }
  .chat-panel { left: 12px; right: 12px; bottom: 82px; width: auto; max-width: none; height: min(520px, calc(100dvh - 104px)); max-height: none; }
  .chat-head { padding: 13px 14px; }
  .chat-log { padding: 12px; }
  .chat-input { padding: 10px; }
  .chat-input input { min-width: 0; padding-left: 11px; padding-right: 11px; }
  .chat-input button { padding: 0 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .rise, .hero-lockup, .scroll-cue span::after { animation: none; opacity: 1; transform: none; }
  .reveal { opacity: 1; transform: none; transition: none; }
}

#sec-home, #sec-about, #sec-projects, #sec-blog, #sec-contact, #sec-do, #sec-showcase {
  scroll-margin-top: calc(var(--header-h) + 14px);
}
.anchor-sec { display: block; }

.anchor-sec + .anchor-sec > section { border-top: 1px solid var(--border); }
.anchor-sec > section { padding-top: 34px; }

.hero-photo {
  position: relative; margin: 0; padding: 24px;
  display: grid; place-items: center;
}
.hero-photo img {
  width: min(100%, 340px); aspect-ratio: 1 / 1; object-fit: cover; object-position: center;
  border-radius: var(--radius);
  border: 5px solid var(--surface);
  box-shadow: 0 26px 60px rgba(111, 91, 163, .28);
  position: relative; z-index: 2;
  animation: zkfloat 8s ease-in-out infinite;
}
.photo-badge {
  position: absolute; z-index: 3; bottom: 6%; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 16px; font-size: .82rem; font-weight: 700; color: var(--heading);
  box-shadow: var(--shadow);
}
.dot-live { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: live 2s ease-out infinite; }
@keyframes live { to { box-shadow: 0 0 0 10px rgba(34,197,94,0); } }

.profile-mark {
  width: 132px; height: 132px; margin: 0 auto 18px; border-radius: 26px;
  background: var(--chip-bg); display: grid; place-items: center; padding: 16px;
}
.profile-mark img { width: 100%; height: auto; }

.main-nav a.active::after { transform: scaleX(1); }

@media (max-width: 980px) {
  .hero-photo img { width: min(100%, 290px); }
}
@media (max-width: 680px) {
  .anchor-sec > section { padding-top: 20px; }
  .photo-badge { font-size: .74rem; padding: 6px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-photo img, .dot-live { animation: none; }
}

.ticker {
  overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  background: var(--surface); padding: 16px 0; margin-top: 10px;
}
.ticker-track {
  display: flex; align-items: center; gap: 26px; width: max-content;
  animation: tick 34s linear infinite;
}
.ticker-track span {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 2vw, 1.35rem);
  text-transform: lowercase; letter-spacing: -0.01em; color: var(--heading); white-space: nowrap;
}
.ticker-track i { color: var(--accent); font-style: normal; font-size: .9rem; }
@keyframes tick { to { transform: translateX(-33.333%); } }

.intro-tell { padding: 74px 0 60px; }
.intro-brand { display: block; width: min(100%, 420px); margin: 0 auto 40px; }
.tell {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.5rem, 3.5vw, 2.55rem); line-height: 1.42;
  letter-spacing: -0.025em; color: var(--heading); max-width: 22ch;
  max-width: min(100%, 20em);
}
.inline-shot {
  display: inline-block; vertical-align: middle;
  width: clamp(74px, 9vw, 128px); aspect-ratio: 4/3;
  border-radius: 14px; overflow: hidden; margin: 0 .18em; 
  box-shadow: 0 10px 24px rgba(111,91,163,.22);
  transform: rotate(-2.2deg);
  transition: transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s ease;
}
.inline-shot:nth-of-type(2n) { transform: rotate(2.4deg); }
.inline-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.inline-shot:hover { transform: rotate(0deg) scale(1.5); box-shadow: 0 22px 44px rgba(111,91,163,.34); z-index: 5; position: relative; }

.story-cover {
  margin: 0 0 18px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border);
}
.story-cover img { width: 100%; height: auto; display: block; }

[data-theme="dark"] .inline-shot { box-shadow: 0 10px 26px rgba(0,0,0,.5); }
[data-theme="dark"] .ticker { background: rgba(17,29,51,.6); }

@media (max-width: 680px) {
  .intro-tell { padding: 44px 0 34px; }
  .tell { font-size: 1.32rem; line-height: 1.5; }
  .inline-shot { width: 66px; }
  .inline-shot:hover { transform: rotate(0) scale(1.2); }
}
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

      "id": "predictive-maintenance",
      "title": {
        "en": "Predictive Maintenance & Anomaly Detection System",
        "tr": "Kestirimci Bakım & Anomali Tespit Sistemi"
      },
      "span": "wide",
      "objective": {
        "en": "Build an IoT-based predictive maintenance platform that continuously collects temperature, vibration, and pressure measurements from industrial machinery and uses them to anticipate failures before they interrupt production.",
        "tr": "Endüstriyel makinelerden gelen sıcaklık, titreşim ve basınç ölçümlerini sürekli toplayan ve bu verilerle arızaları üretimi kesintiye uğratmadan önce öngörmeyi amaçlayan IoT tabanlı bir kestirimci bakım platformu geliştirmek."
      },
      "what_i_did": {
        "en": "Collected live sensor readings through MQTT, organized the time-series data in InfluxDB, and prepared multivariate analysis and classification pipelines in Python. I evaluated Random Forest, XGBoost, and LSTM approaches across temperature, vibration, and pressure signals to identify anomalous operating patterns and estimate machine-failure risk.",
        "tr": "Canlı sensör ölçümlerini MQTT üzerinden topladım, zaman serisi verilerini InfluxDB'de düzenledim ve Python ile çok değişkenli analiz ve sınıflandırma pipeline'ları hazırladım. Anormal çalışma örüntülerini belirlemek ve makine arızası riskini tahmin etmek için sıcaklık, titreşim ve basınç sinyalleri üzerinde Random Forest, XGBoost ve LSTM yaklaşımlarını değerlendirdim."
      },
      "core_features": {
        "en": "Connected the analytics pipeline to live monitoring dashboards built with Grafana and Streamlit/Power BI, giving factory operators a clear view of sensor trends, detected anomalies, and machine-risk thresholds from one operational interface.",
        "tr": "Analiz pipeline'ını Grafana ve Streamlit/Power BI ile hazırlanan canlı izleme panellerine bağladım; fabrika operatörlerinin sensör eğilimlerini, tespit edilen anomalileri ve makine risk eşiklerini tek bir operasyon ekranından izlemesini sağladım."
      },
      "tags": [
        "Python",
        "Scikit-learn",
        "XGBoost",
        "Streamlit",
        "MQTT",
        "InfluxDB",
        "Grafana"
      ],
      "image": "",
      "link": "",
      "details": {
        "en": "The platform combines industrial IoT data collection with predictive analytics. Temperature, vibration, and pressure readings arrive through MQTT and are retained in InfluxDB as time-series data, creating a continuous view of machine operating conditions.\n\nIn Python, the sensor variables are processed for time-series analysis and failure-risk classification. Random Forest, XGBoost, and LSTM models provide alternative ways to capture anomalous behavior and patterns that may precede a malfunction. The resulting indicators and risk thresholds are presented through Grafana and Streamlit/Power BI dashboards so operators can monitor equipment health and act before an unplanned stoppage.",
        "tr": "Platform, endüstriyel IoT veri toplama sürecini kestirimci analizle birleştirir. Sıcaklık, titreşim ve basınç ölçümleri MQTT üzerinden alınır ve zaman serisi olarak InfluxDB'de saklanır; böylece makinelerin çalışma koşulları sürekli izlenebilir.\n\nPython tarafında sensör değişkenleri zaman serisi analizi ve arıza riski sınıflandırması için işlenir. Random Forest, XGBoost ve LSTM modelleri, anormal davranışları ve olası bir arızadan önce ortaya çıkabilecek örüntüleri yakalamak için farklı yaklaşımlar sunar. Üretilen göstergeler ve risk eşikleri Grafana ile Streamlit/Power BI panellerinde sunularak operatörlerin ekipman sağlığını izlemesine ve plansız duruştan önce aksiyon almasına yardımcı olur."
      }
    },
    {
      "id": "cv-quality-control",
      "title": {
        "en": "Computer Vision for Quality Control Automation",
        "tr": "Kalite Kontrol Otomasyonu için Bilgisayarlı Görü"
      },
      "span": "normal",
      "objective": {
        "en": "Automate production-line quality control with a deep-learning system that analyzes products in real time from camera feeds, identifies visible defects, and supports separating faulty items from the line.",
        "tr": "Ürünleri kamera akışlarından gerçek zamanlı analiz eden, görünür kusurları tespit eden ve hatalı ürünlerin üretim hattından ayrılmasını destekleyen derin öğrenme tabanlı bir kalite kontrol sistemi geliştirmek."
      },
      "what_i_did": {
        "en": "Built the visual inspection pipeline in Python with OpenCV and trained custom YOLOv8 real-time object-detection models. The defect scenarios included missing solder points on printed circuit boards (PCBs) and structural tears in textile fabrics, covering two distinct manufacturing inspection use cases.",
        "tr": "Görsel denetim pipeline'ını Python ve OpenCV ile kurdum, özel YOLOv8 gerçek zamanlı nesne tespit modelleri eğittim. Kusur senaryoları, baskılı devre kartlarındaki (PCB) eksik lehim noktalarını ve tekstil kumaşlarındaki yapısal yırtıkları kapsayarak iki farklı üretim denetimi kullanımını ele aldı."
      },
      "core_features": {
        "en": "Optimized the inference flow for high-frame-rate camera streams so defects could be evaluated during production, then containerized the application with Docker to make deployment to edge or line-side environments consistent and repeatable.",
        "tr": "Kusurların üretim sırasında değerlendirilebilmesi için çıkarım akışını yüksek kare hızlı kamera görüntülerine göre optimize ettim; ardından uç veya hat yanı ortamlara tutarlı ve tekrarlanabilir dağıtım için uygulamayı Docker ile konteynerleştirdim."
      },
      "tags": [
        "Python",
        "OpenCV",
        "YOLOv8",
        "Deep Learning",
        "Docker"
      ],
      "image": "",
      "link": "",
      "details": {
        "en": "This automation project applies computer vision directly to manufacturing quality control. OpenCV handles the real-time image stream, while custom YOLOv8 models locate and classify defects such as missing PCB solder points and tears in textile material. The output is designed to support the identification and sorting of defective products without relying solely on manual visual inspection.\n\nBecause the system targets live production conditions, the inference pipeline was optimized for high-frame-rate camera input. Docker packaging provides a consistent runtime for deployment near the production line or on an edge device, keeping the Python, OpenCV, and deep-learning components portable as a single application.",
        "tr": "Bu otomasyon projesi, bilgisayarlı görüyü doğrudan üretim kalite kontrolüne uygular. OpenCV gerçek zamanlı görüntü akışını işlerken özel YOLOv8 modelleri PCB'lerdeki eksik lehim noktaları ve tekstil malzemesindeki yırtıklar gibi kusurları konumlandırıp sınıflandırır. Çıktı, yalnızca manuel görsel kontrole bağlı kalmadan hatalı ürünlerin belirlenmesini ve ayrıştırılmasını destekleyecek biçimde tasarlanmıştır.\n\nSistem canlı üretim koşullarını hedeflediği için çıkarım pipeline'ı yüksek kare hızlı kamera girdisine göre optimize edilmiştir. Docker paketlemesi; Python, OpenCV ve derin öğrenme bileşenlerini tek bir uygulama halinde taşınabilir tutarak üretim hattı yakınında veya uç cihazda tutarlı bir çalışma ortamı sağlar."
      }

    {
      "id": "smart-triage",
      "title": {
        "en": "AI-Supported Smart Triage & Operations Assistant",
        "tr": "Yapay Zeka Destekli Akıllı Triyaj & Operasyon Asistanı"
      },
      "span": "normal",
      "objective": {
        "en": "Develop an AI-supported decision system for emergency departments that analyzes historical medical data, generates a patient risk score, and helps prioritize triage urgency. The work was carried out as a graduation project with TÜBİTAK scope.",
        "tr": "Geçmiş tıbbi verileri analiz eden, hasta için risk skoru üreten ve acil servis triyaj önceliğinin belirlenmesini destekleyen yapay zekâ tabanlı bir karar sistemi geliştirmek. Çalışma, bitirme projesi ve TÜBİTAK kapsamı çerçevesinde yürütüldü."
      },
      "what_i_did": {
        "en": "Prepared and analyzed the MIMIC-IV-ED emergency-department dataset with Pandas, then built and evaluated Scikit-learn models in Python for triage-priority classification and risk scoring. The resulting classification system achieved a documented accuracy of 59.52% and was exposed through a Flask API for application integration.",
        "tr": "MIMIC-IV-ED acil servis veri kümesini Pandas ile hazırlayıp analiz ettim; ardından triyaj önceliği sınıflandırması ve risk skorlama için Python ve Scikit-learn ile modeller geliştirip değerlendirdim. Ortaya çıkan sınıflandırma sistemi belgelenmiş %59,52 doğruluk oranına ulaştı ve uygulama entegrasyonu için Flask API üzerinden sunuldu."
      },
      "core_features": {
        "en": "Added a LangChain-based Large Language Model layer and a Retrieval-Augmented Generation (RAG) assistant so authorized users could query relevant system information in natural language alongside the model's structured triage-priority and risk outputs.",
        "tr": "Modelin yapılandırılmış triyaj önceliği ve risk çıktılarının yanında, yetkili kullanıcıların ilgili sistem bilgilerini doğal dille sorgulayabilmesi için LangChain tabanlı bir LLM katmanı ve RAG (Retrieval-Augmented Generation) asistanı ekledim."
      },
      "tags": [
        "Python",
        "Scikit-learn",
        "LangChain",
        "RAG",
        "Flask API",
        "Data Science"
      ],
      "image": "",
      "link": "",
      "details": {
        "en": "Created as a graduation project within TÜBİTAK scope, the system focuses on decision support for emergency-department triage. Historical clinical records from MIMIC-IV-ED are prepared with Pandas and analyzed in Python; Scikit-learn models then classify triage priority and produce a risk-oriented output to help order urgent cases. The evaluated model reached 59.52% classification accuracy.\n\nA Flask API makes the model available to an application layer instead of leaving it as an isolated experiment. The project also includes a LangChain-based LLM and Retrieval-Augmented Generation assistant, enabling natural-language access to relevant system information while preserving the core machine-learning output as the basis for triage support.",

      "excerpt": "How I combined an XGBoost triage classifier trained on MIMIC-IV-ED with a LangChain RAG layer so operators can question the system in plain language.",
      "cover": "",
      "body": "Emergency departments generate enormous amounts of structured and unstructured data. In my graduation project I trained an XGBoost classifier on the MIMIC-IV-ED dataset, combining vital signs with TF-IDF features extracted from chief-complaint text, and reached an official 59.52% accuracy across the five ESI priority levels.\n\nThe interesting part came after the model: operators do not read confusion matrices. So I wrapped the pipeline with a Retrieval-Augmented Generation assistant built on LangChain. The knowledge base indexes model outputs, feature importances (via SHAP) and operational metadata, letting a nurse ask 'why was this patient marked level 2?' and get a grounded, cited answer.\n\nKey lessons: keep the retrieval corpus small and structured, log every generation next to its retrieved chunks for auditability, and never let the LLM override the classifier — it explains decisions, it does not make them."

  "about_story": {
    "en": "My path into software started in 2022 at Bandırma Onyedi Eylül University, where I chose Software Engineering because I wanted to build systems that actually run in the real world — not just on slides.\n\nThe turning point was my first internship at HOSTİNG.COM in Izmir: integrating payment operators and domain registrar APIs in PHP taught me that production code is about reliability, edge cases and debugging discipline as much as it is about features.\n\nFrom there I moved toward data and intelligence. At Software Persona in Istanbul I worked on Industry 4.0 problems: sensor data pipelines, fault-prediction models with TensorFlow/PyTorch, computer-vision quality control with OpenCV, and MQTT-connected automation interfaces in C#.\n\nIn parallel, I have been completing a second degree in Management Information Systems at Anadolu University, which keeps me close to the business side of technology: processes, optimization and decision-making.\n\nMy graduation project brings it all together — a clinical triage AI trained on the MIMIC-IV-ED dataset, wrapped with a LangChain RAG assistant so that operators can question the system in natural language.\n\nWhat drives me is the same in every project: turning raw data into systems that make better decisions, and making those systems robust enough to trust.",
    "tr": "Yazılım yolculuğum 2022'de Bandırma Onyedi Eylül Üniversitesi'nde başladı; Yazılım Mühendisliği'ni, sadece sunumlarda değil gerçek dünyada çalışan sistemler kurmak istediğim için seçtim.\n\nDönüm noktası İzmir'de HOSTİNG.COM'daki ilk stajımdı: PHP ile ödeme operatörleri ve alan adı tescil API'lerini entegre etmek, üretim kodunun özellik kadar güvenilirlik, uç durumlar ve hata ayıklama disiplini demek olduğunu öğretti.\n\nOradan veri ve yapay zekâya yöneldim. İstanbul'da Software Persona'da Endüstri 4.0 problemleri üzerinde çalıştım: sensör veri hatları, TensorFlow/PyTorch ile arıza tahmin modelleri, OpenCV ile görüntü işleme tabanlı kalite kontrol ve C# ile MQTT bağlantılı otomasyon arayüzleri.\n\nParalelde Anadolu Üniversitesi'nde Yönetim Bilişim Sistemleri ikinci lisansımı sürdürüyorum; bu da beni teknolojinin iş tarafına — süreçlere, optimizasyona ve karar almaya — yakın tutuyor.\n\nBitirme projem hepsini birleştiriyor: MIMIC-IV-ED veri kümesiyle eğitilmiş bir klinik triyaj yapay zekâsı ve operatörlerin sisteme doğal dille soru sorabilmesi için LangChain tabanlı bir RAG asistanı.\n\nHer projede beni motive eden şey aynı: ham veriyi daha iyi karar veren sistemlere dönüştürmek ve bu sistemleri güvenilecek kadar sağlam yapmak."

  function bindContact() {
    const btn = document.getElementById("cf-send");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const t = T();
      const name = document.getElementById("cf-name").value.trim();
      const email = document.getElementById("cf-email").value.trim();
      const subject = document.getElementById("cf-subject").value.trim();
      const msg = document.getElementById("cf-msg").value.trim();
      const status = document.getElementById("cf-status");
      if (!name || !email || !msg) { status.textContent = t.f_fill; status.className = "cf-status err"; return; }
      try {
        let res;
        if (DATA.contact.formspree_id) {
          res = await fetch(`https://formspree.io/f/${DATA.contact.formspree_id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ name, email, subject, message: msg })
          });
        } else {
          const body = new URLSearchParams({ "form-name": "contact", name, email, subject, message: msg }).toString();
          res = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        status.textContent = t.f_ok; status.className = "cf-status ok";
        document.getElementById("cf-name").value = "";
        document.getElementById("cf-email").value = "";
        document.getElementById("cf-msg").value = "";
        document.getElementById("cf-subject").value = "";
      } catch (e) {
        status.textContent = t.f_err; status.className = "cf-status err";
        location.href = `mailto:${DATA.contact.email}?subject=${encodeURIComponent(subject || ("Portfolio message from " + name))}&body=${encodeURIComponent(msg + "\n\n— " + name + " (" + email + ")")}`;
      }
    });
  }

  async function sha256(str) {
    if (window.crypto && crypto.subtle) {
      try {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) {  }
    }
    return sha256js(unescape(encodeURIComponent(str)));
  }
  function sha256js(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    const mathPow = Math.pow, maxWord = mathPow(2, 32);
    let result = "", words = [], asciiBitLength = ascii.length * 8;
    let hash = sha256js.h = sha256js.h || [], k = sha256js.k = sha256js.k || [], primeCounter = k.length;
    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += "\x80";
    while (ascii.length % 64 - 56) ascii += "\x00";
    for (let i = 0; i < ascii.length; i++) {
      const j = ascii.charCodeAt(i);
      if (j >> 8) return "";
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;
    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16), oldHash = hash.slice(0, 8);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const temp1 = hash[7]
          + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
          + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        const temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (let i = 0; i < 8; i++)
      for (let j = 3; j + 1; j--) {
        const b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : "") + b.toString(16);
      }
    return result;
  }

    function pickImage(cb, maxW = 1400, quality = 0.82) {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = "image/*";
      inp.onchange = () => {
        const file = inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            cb(canvas.toDataURL("image/webp", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };
      inp.click();
    }

    function pickPdf(cb) {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = "application/pdf";
      inp.onchange = () => {
        const file = inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => cb(reader.result);
        reader.readAsDataURL(file);
      };
      inp.click();
    }

  let chatMounted = false, chatEls = null;
  function mountChat() {
    if (chatMounted) { refreshChatLang(); return; }
    chatMounted = true;

    const fab = document.createElement("button");
    fab.className = "chat-fab"; fab.setAttribute("aria-label", "Open chat");
    fab.innerHTML = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3c-1.5 0-2.9-.3-4.1-1L3 20l1.3-4.2a8.1 8.1 0 0 1-1.3-4.3A8.4 8.4 0 0 1 11.5 3.2 8.4 8.4 0 0 1 21 11.5z"/></svg>`;
    const panel = document.createElement("div");
    panel.className = "chat-panel";
    panel.innerHTML = `
      <div class="chat-head">
        <img src="${window.ZK_LOGO_MARK}" alt="">
        <div><h4>ZK Assist</h4><span id="chat-sub"></span></div>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-pills" id="chat-pills"></div>
      <div class="chat-input">
        <input id="chat-input" type="text" autocomplete="off">
        <button id="chat-send" aria-label="Send">➤</button>
      </div>`;
    document.body.appendChild(fab);
    document.body.appendChild(panel);
    chatEls = { fab, panel };
    refreshChatLang();

    const log = panel.querySelector("#chat-log");
    const input = panel.querySelector("#chat-input");

    let opened = false;
    fab.addEventListener("click", () => {
      panel.classList.toggle("open");
      if (!opened) { opened = true; bot(L(DATA.chat.intro)); }
      if (panel.classList.contains("open")) input.focus();
    });
    panel.querySelector("#chat-send").addEventListener("click", () => ask(input.value));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(input.value); });

    function add(cls, text) {
      const m = document.createElement("div");
      m.className = "msg " + cls; m.textContent = text;
      log.appendChild(m); log.scrollTop = log.scrollHeight;
    }
    const bot = (t) => add("bot", t);
    function ask(q) {
      q = (q || "").trim(); if (!q) return;
      add("user", q); input.value = "";
      setTimeout(() => bot(answer(q)), 260);
    }
    panel._ask = ask;
  }
  function refreshChatLang() {
    if (!chatEls) return;
    const { panel } = chatEls;
    panel.querySelector("#chat-sub").textContent = LANG === "tr" ? "portfolyo verisinden cevap verir" : "answers from portfolio data";
    panel.querySelector("#chat-input").placeholder = LANG === "tr" ? "Zeliha hakkında soru sorun…" : "Ask about Zeliha…";
    const pills = panel.querySelector("#chat-pills");
    pills.innerHTML = "";
    ((DATA.chat.prompts || {})[LANG] || []).forEach(p => {
      const b = document.createElement("button");
      b.textContent = p;
      b.addEventListener("click", () => panel._ask(p));
      pills.appendChild(b);
    });
  }

  const norm = (s) => s.toLowerCase()
    .replace(/ı/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g")
    .replace(/ü/g, "u").replace(/ö/g, "o").replace(/ç/g, "c");
  function isTurkish(q) {
    if (/[ışğüöçİ]/.test(q) ||
      /\b(nedir|nerede|neler|hangi|kim(dir)?|nasil|proje\w*|calis\w*|okul\w*|dil(ler\w*)?|beceri\w*|yetenek\w*|staj\w*|deneyim\w*|iletisim\w*|mezun\w*|universite\w*|hakkinda|anlat)\b/i.test(norm(q))) return true;
    if (/\b(what|who|where|when|which|how|does|do|is|are|can|her|she|show|tell|about)\b/i.test(q)) return false;
    return LANG === "tr";
  }
  
  const PRIVATE_RE = /\b(telefon\w*|numaras?i?\b|phone|gsm|whatsapp|adres\w*|address|nerede (yasiyor|oturuyor|kaliyor)|where does (she|zeliha) live|home town|dogum\w*|birth ?date|birthday|kac yasinda|yasi kac|how old|age\b|tc\b|tckn|kimlik\w*|national id|passport|pasaport|evli\s*mi|bekar\s*mi|sevgili\w*|boyfriend|girlfriend|iliskisi|relationship status|maas\w*|salary|kazanc\w*|income|instagram|facebook|snapchat|tiktok|okul numara\w*|ogrenci numara\w*|student (id|number)|sifre\w*|password)\b/i;

  function answer(q) {
    const D = DATA;
    const nq = norm(q);
    const tr = isTurkish(q);
    const has = (...words) => words.some(w => nq.includes(w));

    if (PRIVATE_RE.test(nq)) {
      return tr
        ? `Kişisel ve özel bilgileri paylaşamıyorum. 🙂 Zeliha'ya ulaşmak isterseniz e-posta (${D.contact.email}) veya LinkedIn kullanabilirsiniz; sayfadaki Görüş & İletişim formunu da doldurabilirsiniz.`
        : `I can't share personal or private information. 🙂 To reach Zeliha, please use email (${D.contact.email}) or LinkedIn — or the Feedback & Contact form on this site.`;
    }
    if (has("graduation", "thesis", "bitirme", "triage", "triyaj", "mimic", "capstone")) {
      const p = D.projects.find(x => x.id === "smart-triage") || D.projects[0];
      return tr
        ? `Zeliha'nın bitirme projesi "${L(p.title)}". ${p.what_i_did.tr} ${p.core_features.tr} Teknolojiler: ${p.tags.join(", ")}.`
        : `Zeliha's graduation project is "${p.title.en}". ${p.what_i_did.en} ${p.core_features.en} Tech: ${p.tags.join(", ")}.`;
    }
    if (has("skill", "beceri", "yetenek", "teknoloji", "stack", "tool", "arac", "bilgisayar")) {
      const lines = D.skills.map(c => `• ${tr ? c.category.tr : c.category.en}: ${c.items.join(", ")}`).join("\n");
      return (tr ? "Zeliha'nın teknik becerileri:\n" : "Zeliha's core software skills:\n") + lines;
    }
    if (has("work", "job", "intern", "staj", "deneyim", "experience", "calis", "company", "sirket", "career")) {
      const lines = D.experience.map(x => `• ${tr ? x.role.tr : x.role.en} — ${x.company} (${tr ? x.location.tr : x.location.en}, ${x.period})${x.focus ? ": " + (tr ? x.focus.tr : x.focus.en) : ""}`).join("\n");
      return (tr ? "İş deneyimi:\n" : "Work experience:\n") + lines;
    }
    if (has("education", "egitim", "university", "universite", "okul", "school", "study", "gpa", "ortalama", "mezun", "degree")) {
      const lines = D.education.map(e => `• ${e.institution} — ${tr ? e.degree.tr : e.degree.en} (${e.years})${e.gpa ? ", " + (tr ? "Ortalama" : "GPA") + " " + e.gpa : ""}`).join("\n");
      return (tr ? "Eğitim bilgileri:\n" : "Education:\n") + lines;
    }
    if (has("language", "dil", "english", "german", "ingilizce", "almanca", "speak", "konus")) {
      const lines = D.personal_info.languages.map(lg => `• ${tr ? lg.name.tr : lg.name.en}: ${tr ? lg.level.tr : lg.level.en}`).join("\n");
      return (tr ? "Konuştuğu diller:\n" : "Languages:\n") + lines;
    }
    if (has("contact", "iletisim", "email", "mail", "linkedin", "github", "reach", "ulas")) {
      return (tr ? "İletişim:\n" : "Contact:\n") +
        `• Email: ${D.contact.email}\n• LinkedIn: ${D.contact.linkedin}\n• GitHub: ${D.contact.github}` +
        (tr ? "\n\nSayfadaki Görüş & İletişim formunu da kullanabilirsiniz." : "\n\nYou can also use the Feedback & Contact form on this site.");
    }
    if (has("blog", "article", "yazi", "makale", "post")) {
      const lines = (D.blog || []).map(b => `• ${b.title} (${b.date})`).join("\n");
      return (tr ? "Blog yazıları:\n" : "Blog articles:\n") + (lines || (tr ? "Henüz yazı yok." : "No articles yet."));
    }
    const pHit = D.projects.find(p => norm(L(p.title) + " " + p.tags.join(" ")).split(/\W+/).some(w => w.length > 3 && nq.includes(w)));
    if (pHit && has("project", "proje", ...pHit.tags.map(x => norm(x)))) {
      return tr
        ? `"${pHit.title.tr}" — Amaç: ${pHit.objective.tr} Yaptıkları: ${pHit.what_i_did.tr} Teknolojiler: ${pHit.tags.join(", ")}.`
        : `"${pHit.title.en}" — Objective: ${pHit.objective.en} What she did: ${pHit.what_i_did.en} Tech: ${pHit.tags.join(", ")}.`;
    }
    if (has("project", "proje", "portfolio", "yapti", "built")) {
      const lines = D.projects.map(p => `• ${tr ? p.title.tr : p.title.en} [${p.tags.slice(0, 3).join(", ")}]`).join("\n");
      return (tr ? "Öne çıkan projeler:\n" : "Flagship projects:\n") + lines +
        (tr ? "\n\nBir projenin adını yazarsanız detayını anlatayım." : "\n\nAsk about any of them by name for details.");
    }
    if (has("who", "kim", "hakkinda", "about", "zeliha")) {
      return tr
        ? `${D.personal_info.name} bir yazılım mühendisi. ${D.site.hero_paragraph.tr}`
        : `${D.personal_info.name} is a software engineer. ${D.site.hero_paragraph.en}`;
    }
    return tr
      ? "Bu bilgi portfolyo verisinde yok. Şunları sorabilirsiniz: projeler, beceriler, eğitim, staj deneyimi, diller veya iletişim."
      : "I can only answer from Zeliha's portfolio data. Try asking about her projects, skills, education, experience, languages or contact info.";
  }

          if (el && el.getBoundingClientRect().top + window.pageYOffset <= line) current = id;
        });
        if (window.innerHeight + window.pageYOffset >= document.body.scrollHeight - 80) current = "contact";
        markActiveNav(current);
      }, 90);
    };
    window.removeEventListener("scroll", onScroll);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  
  const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mountMarquee() {
    const track = document.getElementById("proj-track");
    const box = document.getElementById("proj-marquee");
    if (!track || !box) return;
    const cards = [].slice.call(track.children);
    if (!cards.length) return;

    for (let pass = 0; pass < 2; pass++) {
      cards.forEach(c => {
        const clone = c.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        clone.classList.add("in");
        track.appendChild(clone);
      });
    }
    cards.forEach(c => c.classList.add("in"));

    if (REDUCED) { box.classList.add("static"); return; }

    let x = 0, paused = false, dragging = false, startX = 0, startOff = 0, last = 0;
    const speed = 0.035; // px / ms
    const width = () => track.scrollWidth / 3;

    box.addEventListener("mouseenter", () => { paused = true; });
    box.addEventListener("mouseleave", () => { paused = false; });
    box.addEventListener("focusin", () => { paused = true; });
    box.addEventListener("focusout", () => { paused = false; });

    const down = (e) => {
      dragging = true; paused = true; box.classList.add("grabbing");
      startX = (e.touches ? e.touches[0].clientX : e.clientX); startOff = x;
    };
    const move = (e) => {
      if (!dragging) return;
      const cx = (e.touches ? e.touches[0].clientX : e.clientX);
      x = startOff + (cx - startX);
      apply();
    };
    const up = () => { dragging = false; paused = false; box.classList.remove("grabbing"); };
    box.addEventListener("mousedown", down);
    box.addEventListener("touchstart", down, { passive: true });
    window.addEventListener("mousemove", move);
    box.addEventListener("touchmove", move, { passive: true });
    window.addEventListener("mouseup", up);
    box.addEventListener("touchend", up);

    function apply() {
      const w = width();
      if (w > 0) { while (x <= -w) x += w; while (x > 0) x -= w; }
      track.style.transform = "translate3d(" + x + "px,0,0)";
    }
    function step(ts) {
      if (!document.getElementById("proj-track")) return; // sayfa değişti
      const dt = last ? Math.min(ts - last, 48) : 16;
      last = ts;
      if (!paused && !dragging) { x -= speed * dt; apply(); }
      requestAnimationFrame(step);
    }
    apply();
    requestAnimationFrame(step);
  }

  function runCounters(scope) {
    (scope || document).querySelectorAll("[data-count]").forEach(el => {
      if (el.dataset.done) return;
      const raw = el.dataset.count || "";
      const num = parseFloat(raw.replace(/[^0-9.]/g, ""));
      if (!isFinite(num) || num <= 0) return;
      const suffix = raw.replace(/[0-9.,]/g, "");
      el.dataset.done = "1";
      if (REDUCED) return;
      const dur = 1100, t0 = performance.now();
      el.textContent = "0" + suffix;
      (function tick(now) {
        const p = Math.min((now - t0) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(num * eased) + suffix;
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = raw;
      })(t0);
    });
  }

  function observeReveals() {
    if (!("IntersectionObserver" in window)) {
      document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
      runCounters();
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        if (e.target.classList.contains("stats-grid") || e.target.querySelector("[data-count]")) runCounters(e.target);
        if (e.target.hasAttribute("data-count")) runCounters(e.target.parentNode);
        io.unobserve(e.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  }

  
  let topBtn = null;
  function mountToTop() {
    if (!topBtn) {
      topBtn = document.createElement("button");
      topBtn.className = "to-top";
      topBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      topBtn.addEventListener("click", function () {
        try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
      });
      document.body.appendChild(topBtn);
      window.addEventListener("scroll", function () {
        topBtn.classList.toggle("show", window.pageYOffset > 420);
      });
    }
    topBtn.setAttribute("aria-label", T().topAria);
    topBtn.style.display = document.body.classList.contains("admin-mode") ? "none" : "";
  }

  
  let roleTimer = null;
  function startRoleRotation() {
    clearInterval(roleTimer);
    const roles = DATA.site.roles || [];
    if (roles.length < 2) return;
    let i = 0;
    roleTimer = setInterval(() => {
      const el = document.getElementById("hero-role");
      if (!el) { clearInterval(roleTimer); return; }
      i = (i + 1) % roles.length;
      el.classList.add("swap");
      setTimeout(() => { el.textContent = L(roles[i]); el.classList.remove("swap"); }, 240);
    }, 2600);
  }

  function render() {
    applyTheme();
    const { name: r, param } = routeParts();
    const isAdmin = r === "zk-panel-2026";
    document.body.classList.toggle("admin-mode", isAdmin);
    mountToTop();
    let rebuiltMain = false;

    if (isAdmin) {
      VIEW = "admin";
      app.innerHTML = pageAdmin();
      bindAdmin();
    } else {
      const SECTIONS = { home: "sec-home", about: "sec-about", projects: "sec-projects", contact: "sec-contact" };
      const isSection = Object.prototype.hasOwnProperty.call(SECTIONS, r);
      let body, active, scrollTo = null, rebuilt = true;

      if (r === "project") { body = pageProjectDetail(param); active = "projects"; VIEW = "detail"; }
      else if (r === "post") { body = pagePostDetail(param); active = "blog"; VIEW = "detail"; }
      else {
        active = isSection ? r : "home";
        scrollTo = SECTIONS[active];
        if (VIEW === "main" && document.getElementById("sec-home")) {
          rebuilt = false;                       // sayfa zaten açık: sadece kaydır
        } else { body = pageMain(); VIEW = "main"; rebuiltMain = true; }
      }

      if (rebuilt) {
        app.innerHTML = shellHeader(active) + noticeBar() + `<main>${body}</main>` + shellFooter();
      } else {
        markActiveNav(active);
      }
      if (rebuilt) {
        const nb = document.getElementById("notice-close");
        if (nb) nb.addEventListener("click", () => {
          LS.setItem("zk-notice-dismissed", "1");
          document.getElementById("site-notice").remove();
        });
        const t = document.getElementById("nav-toggle");
        if (t) t.addEventListener("click", () => document.getElementById("main-nav").classList.toggle("open"));
        document.querySelectorAll(".lang-toggle button").forEach(b => {
          b.addEventListener("click", () => {
            if (LANG === b.dataset.lang) return;
            LANG = b.dataset.lang;
            LS.setItem("zk-lang", LANG);
            VIEW = null; render();
          });
        });
        const tt = document.getElementById("theme-toggle");
        if (tt) tt.addEventListener("click", toggleTheme);
        document.querySelectorAll(".main-nav a[data-sec]").forEach(a => {
          a.addEventListener("click", () => {
            const nav = document.getElementById("main-nav");
            if (nav) nav.classList.remove("open");
          });
        });
        bindContact();
      }
      mountChat();
      if (VIEW === "main") startRoleRotation(); else clearInterval(roleTimer);

      if (VIEW === "main") {
        const target = scrollTo && document.getElementById(scrollTo);
        if (target && scrollTo !== "sec-home") {
          setTimeout(() => scrollToEl(target), rebuilt ? 60 : 0);
        } else if (rebuilt) {
          window.scrollTo(0, 0);
        } else {
          scrollToEl(document.body, true);
        }
      } else {
        window.scrollTo(0, 0);
      }
    }

    observeReveals();
    if (!isAdmin && VIEW === "main" && rebuiltMain) { mountMarquee(); mountScrollSpy(); }
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", render);
  if (document.readyState !== "loading") render();
})();

</script>
</body>
