 "about_story": {
  "en": "My path into software started in 2022 at Bandırma Onyedi Eylül University, where I chose Software Engineering because I wanted to build systems that actually run in the real world — not just on slides.\n\nThe turning point was my first internship at HOSTİNG.COM in Izmir: integrating payment operators and domain registrar APIs in PHP taught me that production code is about reliability, edge cases and debugging discipline as much as it is about features.\n\nFrom there I moved toward data and intelligence. At Software Persona in Istanbul I worked on Industry 4.0 problems: sensor data pipelines, fault-prediction models with TensorFlow/PyTorch, computer-vision quality control with OpenCV, and MQTT-connected automation interfaces in C#.\n\nIn parallel, I have been completing a second degree in Management Information Systems at Anadolu University, which keeps me close to the business side of technology: processes, optimization and decision-making.\n\nMy graduation project brings it all together — a clinical triage AI trained on the MIMIC-IV-ED dataset, wrapped with a LangChain RAG assistant so that operators can question the system in natural language.\n\nWhat drives me is the same in every project: turning raw data into systems that make better decisions, and making those systems robust enough to trust.",
  "tr": "Yazılım yolculuğum 2022'de Bandırma Onyedi Eylül Üniversitesi'nde başladı; Yazılım Mühendisliği'ni, sadece sunumlarda değil gerçek dünyada çalışan sistemler kurmak istediğim için seçtim.\n\nDönüm noktası İzmir'de HOSTİNG.COM'daki ilk stajımdı: PHP ile ödeme operatörleri ve alan adı tescil API'lerini entegre etmek, üretim kodunun özellik kadar güvenilirlik, uç durumlar ve hata ayıklama disiplini demek olduğunu öğretti.\n\nOradan veri ve yapay zekâya yöneldim. İstanbul'da Software Persona'da Endüstri 4.0 problemleri üzerinde çalıştım: sensör veri hatları, TensorFlow/PyTorch ile arıza tahmin modelleri, OpenCV ile görüntü işleme tabanlı kalite kontrol ve C# ile MQTT bağlantılı otomasyon arayüzleri.\n\nParalelde Anadolu Üniversitesi'nde Yönetim Bilişim Sistemleri ikinci lisansımı sürdürüyorum; bu da beni teknolojinin iş tarafına — süreçlere, optimizasyona ve karar almaya — yakın tutuyor.\n\nBitirme projem hepsini birleştiriyor: MIMIC-IV-ED veri kümesiyle eğitilmiş bir klinik triyaj yapay zekâsı ve operatörlerin sisteme doğal dille soru sorabilmesi için LangChain tabanlı bir RAG asistanı.\n\nHer projede beni motive eden şey aynı: ham veriyi daha iyi karar veren sistemlere dönüştürmek ve bu sistemleri güvenilecek kadar sağlam yapmak."
